<style>
/* Mise en page : rail de navigation (ordinateur) / barre d'onglets en bas (téléphone),
   contenu en colonne de lecture large. Identité : couleurs de l'ENSAM Meknès, bleu (actions), orange (impact), bleu nuit. */
:root {
  --bg: #EEF2F7; --surface: #FFFFFF; --surface-2: #E6EBF2; --raised: #FFFFFF; --ink: #13213A; --ink-2: #42506A; --muted: #58657A; --line: #DDE4ED; --line-strong: #C5CFDC;
  --accent: #1670A8; --accent-ink: #FFFFFF; --accent-soft: #E2F0F9; --accent-hover: #12628F;
  --brass: #A65400; --brass-soft: #FDEBD3; --orange: #F39200; --navy: #1F3354;
  --brass-on-ink: #F6A94A; --blue-text: #135F8F; --lvl1: #9C6B3E; --bad-ink: #FFFFFF;
  --good: #1D7348; --good-soft: #E1F2E8; --warn: #9A5800; --warn-soft: #FAEDD5; --bad: #B0222E; --bad-soft: #FAE3E4;
  --s1: #1670A8; --s2: #F39200; --blue: #1670A8; --teal: #0F6F66; --indigo: #4A4FB5;
  --em-o: #F39200; --em-b: #1B7DBF; --em-n: #1F3354;
  /* Élévation : 1 = cartes (sans bordure, ombre douce et filet très léger), 2 = survol et éléments levés, 3 = feuilles et menus */
  --hair: rgb(19 33 58 / .07);
  --sh1: 0 0 0 1px var(--hair), 0 1px 2px rgb(19 33 58 / .04), 0 3px 10px -4px rgb(19 33 58 / .08);
  --sh2: 0 0 0 1px var(--hair), 0 2px 4px rgb(19 33 58 / .05), 0 12px 28px -10px rgb(19 33 58 / .2);
  --sh3: 0 0 0 1px var(--hair), 0 20px 50px -14px rgb(10 20 40 / .32);
  --shadow: var(--sh1); --shadow-lift: var(--sh2);
  /* Une seule façon de montrer « choisi » (puces, segments, onglets, barre du bas, barre latérale), et le bouton tonal des listes */
  --sel-bg: #E2F0F9; --sel-ink: #135F8F; --sel-ring: rgb(22 112 168 / .34);
  --tonal-bg: #E2F0F9; --tonal-ink: #135F8F; --tonal-hover: #D3E8F6;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: var(--f-body);
  /* Échelles : 12 · 13 · 15 · 17 · 20 · 24 · 28 px ; rayons 8 · 12 · 16 · 22 ; espaces 4 · 8 · 12 · 16 · 24 · 32 · 48 ; icônes 16 · 20 · 24 */
  --fs-1: .75rem; --fs-2: .8125rem; --fs-3: .9375rem; --fs-4: 1.0625rem; --fs-5: 1.25rem; --fs-6: 1.5rem; --fs-7: 1.75rem;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-pill: 999px; --r: var(--r-md);
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem; --sp-7: 3rem;
  --ico-s: 16px; --ico-m: 20px; --ico-l: 24px;
}
/* Nuit : quatre bleus nuit, ce qui est au-dessus est plus clair (fond, cartes, éléments levés, feuilles) ; plus de fonds bruns */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1320; --surface: #131D2D; --surface-2: #1B2739; --raised: #24324A; --ink: #E6ECF4; --ink-2: #B3BFD0; --muted: #8C9AB0; --line: #233046; --line-strong: #34445D;
  --accent: #5DB4EA; --accent-ink: #04121F; --accent-soft: #1A3450; --accent-hover: #7CC3EE; --brass: #F6A94A; --brass-soft: #2C2B31; --orange: #F6A94A; --navy: #C9D6E8;
  --brass-on-ink: #8F4800; --blue-text: #7CC3EE; --lvl1: #C8925F; --bad-ink: #2A0A0C;

  --s1: #5DB4EA; --s2: #F6A94A; --blue: #5DB4EA; --teal: #4FC7B9; --indigo: #A4A8F7;
  --em-o: #F6A23A; --em-b: #4BA8E6; --em-n: #C9D6E8;
  --hair: rgb(255 255 255 / .05);
  --sh1: inset 0 1px 0 rgb(255 255 255 / .035), 0 0 0 1px var(--hair);
  --sh2: inset 0 1px 0 rgb(255 255 255 / .05), 0 0 0 1px rgb(255 255 255 / .08), 0 14px 30px -14px rgb(0 0 0 / .7);
  --sh3: inset 0 1px 0 rgb(255 255 255 / .06), 0 0 0 1px rgb(255 255 255 / .07), 0 24px 60px -16px rgb(0 0 0 / .75);
  --sel-bg: #1C3A58; --sel-ink: #9AD2F5; --sel-ring: rgb(93 180 234 / .42);
  --tonal-bg: #1A3450; --tonal-ink: #9AD2F5; --tonal-hover: #20405F; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1320; --surface: #131D2D; --surface-2: #1B2739; --raised: #24324A; --ink: #E6ECF4; --ink-2: #B3BFD0; --muted: #8C9AB0; --line: #233046; --line-strong: #34445D;
  --accent: #5DB4EA; --accent-ink: #04121F; --accent-soft: #1A3450; --accent-hover: #7CC3EE; --brass: #F6A94A; --brass-soft: #2C2B31; --orange: #F6A94A; --navy: #C9D6E8;
  --brass-on-ink: #8F4800; --blue-text: #7CC3EE; --lvl1: #C8925F; --bad-ink: #2A0A0C;
  --good: #5DC991; --good-soft: #1B3338; --warn: #EEAE52; --warn-soft: #2E2E31; --bad: #F27C83; --bad-soft: #312938;
  --s1: #5DB4EA; --s2: #F6A94A; --blue: #5DB4EA; --teal: #4FC7B9; --indigo: #A4A8F7;
  --em-o: #F6A23A; --em-b: #4BA8E6; --em-n: #C9D6E8;
  --hair: rgb(255 255 255 / .05);
  --sh1: inset 0 1px 0 rgb(255 255 255 / .035), 0 0 0 1px var(--hair);
  --sh2: inset 0 1px 0 rgb(255 255 255 / .05), 0 0 0 1px rgb(255 255 255 / .08), 0 14px 30px -14px rgb(0 0 0 / .7);
  --sh3: inset 0 1px 0 rgb(255 255 255 / .06), 0 0 0 1px rgb(255 255 255 / .07), 0 24px 60px -16px rgb(0 0 0 / .75);
  --sel-bg: #1C3A58; --sel-ink: #9AD2F5; --sel-ring: rgb(93 180 234 / .42);
  --tonal-bg: #1A3450; --tonal-ink: #9AD2F5; --tonal-hover: #20405F; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 750; letter-spacing: -.015em; line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.2rem); }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .84rem; } .spacer { flex: 1; }
.eyebrow { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: .3rem; }
.lead { color: var(--ink-2); max-width: 62ch; margin-top: .4rem; }
.sel { user-select: all; }
.row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.row-end { display: flex; justify-content: flex-end; gap: .6rem; flex-wrap: wrap; margin-top: .4rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .8rem; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .8rem; }

/* Coque */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 1.2rem; padding: 1.2rem .9rem; background: var(--surface); border-inline-end: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: .65rem; }
.brand-txt { display: flex; flex-direction: column; line-height: 1.2; } .brand-txt strong { font-family: var(--f-display); font-size: 1.05rem; } .brand-txt span { font-size: .75rem; color: var(--muted); }
.brand-mark { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 750 .95rem/1 var(--f-display); letter-spacing: .02em; flex: none; }
.brand-mark.big { width: 64px; height: 64px; font-size: 1.5rem; border-radius: 14px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a { display: flex; align-items: center; gap: .7rem; padding: .55rem .7rem; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; position: relative; }
.side-nav a:hover { background: var(--surface-2); color: var(--ink); }
.side-nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.dotn { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-inline-start: auto; }
.side-foot { margin-top: auto; padding: 0 .7rem; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: .7rem; padding-block: .6rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.mobile-only { display: none; }
.skip { position: fixed; top: .5rem; inset-inline-start: .5rem; z-index: 100; padding: .55rem .9rem; border-radius: 8px; background: var(--ink); color: var(--bg); font-weight: 600; text-decoration: none; transform: translateY(-200%); }
.skip:focus { transform: none; }
.content:focus { outline: none; }
.demo-band { padding-block: .45rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--brass-soft); color: var(--brass); font-size: .82rem; border-bottom: 1px solid var(--line); }
.content { padding-block: 1.6rem 5rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.1rem; }
.page.narrow { max-width: 760px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.section-head { display: flex; align-items: center; gap: .7rem; justify-content: space-between; flex-wrap: wrap; margin-top: .6rem; }
.section-title { margin-top: .6rem; }
.persona { display: flex; align-items: center; gap: .4rem; }
.persona select { max-width: 13rem; }
.me-btn { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
.bell-wrap { position: relative; }
.badge-n { position: absolute; top: -2px; inset-inline-end: -2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 600 .68rem/17px var(--f-body); text-align: center; }
.notif { display: flex; gap: .6rem; align-items: flex-start; text-align: start; width: 100%; padding: .55rem .5rem; border: 0; background: none; border-radius: 8px; cursor: pointer; color: var(--ink-2); }
.notif span { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.notif:hover { background: var(--surface-2); }
.notif.act { color: var(--ink); } .notif.act .ico:first-child { color: var(--accent); }
.bottom-nav { display: none; }

/* Éléments */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .55rem 1rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.accent { background: var(--brass-soft); border-color: color-mix(in srgb, var(--brass) 40%, transparent); color: var(--brass); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--bad-ink); }
.danger-t { color: var(--bad) !important; }
.btn.small { padding: .38rem .75rem; font-size: .86rem; }
.btn.tiny { padding: .25rem .55rem; font-size: .8rem; }
.btn.wide { width: 100%; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; position: relative; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn.small { width: 28px; height: 28px; }
.icon-btn.on { color: var(--accent); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; }
input, select, textarea { width: 100%; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
input[type="checkbox"], input[type="radio"] { width: auto; flex: none; accent-color: var(--accent); }
select { width: auto; max-width: 100%; }
textarea { resize: vertical; }
.field { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.field-label { font-size: .82rem; font-weight: 600; color: var(--ink-2); }
.field-hint { font-size: .78rem; color: var(--muted); }
/* Publier : seuls les champs obligatoires encore vides sont signalés, après un essai ; ce que « Offre en 30 secondes » a rempli s'éclaire */
.field-err { font-size: .8rem; font-weight: 600; color: var(--warn); }
.field.manque :is(input, textarea), .field.manque .chip:not(.on) { border-color: var(--warn); }
.cv-drop.manque { border-color: var(--warn); border-style: solid; background: color-mix(in srgb, var(--warn-soft) 55%, var(--surface)); }
@keyframes rempli { from { background-color: var(--accent-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); } }
.rempli { animation: rempli 1.2s ease-out backwards; animation-delay: calc(var(--i, 0) * 70ms); }
.rempli:not(input, textarea, .type-opt) { border-radius: var(--r); }
.li-box { border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: var(--r); padding: .55rem .8rem; background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.li-box summary { cursor: pointer; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: .4rem; }
.li-box[open] { display: flex; flex-direction: column; gap: .55rem; }
.li-box[open] summary { margin-bottom: .1rem; }
.li-steps { margin: 0; padding-inline-start: 1.2rem; color: var(--ink-2); display: flex; flex-direction: column; gap: .2rem; }
.li-box textarea { width: 100%; }
.li-faits { margin: 0; display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; }
.form { display: flex; flex-direction: column; gap: .9rem; }
.checks { display: flex; flex-direction: column; gap: .4rem; }
.check, .switch { display: flex; align-items: center; gap: .5rem; font-size: .9rem; cursor: pointer; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; flex: none; background: hsl(var(--h, 205) var(--s, 50%) 93%); color: hsl(var(--h, 205) var(--s2, 58%) 28%); font-weight: 600; font-family: var(--f-body); letter-spacing: .01em; line-height: 1; }
.avatar { position: relative; overflow: hidden; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.person { display: inline-flex; align-items: center; gap: .6rem; border: 0; background: none; padding: 0; text-align: start; cursor: pointer; min-width: 0; color: inherit; }
.person-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.person-name { font-weight: 600; }
.person:hover .person-name { color: var(--accent); }
.role-line { font-size: .8rem; color: var(--muted); display: inline-flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
.verif { color: var(--teal); display: inline-flex; flex: none; }
.lvl { font: 600 var(--fs-1)/1 var(--f-body); padding: .22rem .5rem; border-radius: var(--r-pill); border: 1px solid currentColor; color: var(--muted); }
.lvl-1 { color: var(--lvl1); } .lvl-2 { color: var(--ink-2); } .lvl-3, .lvl-4, .lvl-5 { color: var(--brass); background: var(--brass-soft); }
.tabs { display: flex; gap: .2rem; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: .6rem .8rem; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.count { display: inline-block; min-width: 1.4em; padding: 0 .35em; border-radius: 9px; background: var(--surface-2); color: var(--ink-2); font: 600 .74rem/1.5 var(--f-mono); text-align: center; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 9px; align-self: flex-start; }
.seg button { border: 0; background: transparent; padding: .38rem .8rem; border-radius: 7px; font-weight: 600; font-size: .86rem; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.chips { display: flex; gap: .4rem; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: .3rem; border: 1px solid var(--line); background: var(--surface); padding: .3rem .75rem; border-radius: 999px; font-size: .85rem; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.mini { display: inline-block; font-size: .74rem; padding: .1rem .45rem; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); margin: 0 .25rem .25rem 0; font-weight: 500; }
.tag { display: inline-flex; align-items: center; gap: .25rem; font-size: .74rem; font-weight: 600; padding: .18rem .5rem; border-radius: 5px; letter-spacing: .01em; }
.t-stage { --c: var(--blue); } .t-pfe { --c: var(--indigo); } .t-etranger { --c: var(--teal); } .t-emploi { --c: var(--brass); }
.tag.t-stage, .tag.t-pfe, .tag.t-etranger, .tag.t-emploi { color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.chip.on.t-stage, .chip.on.t-pfe, .chip.on.t-etranger, .chip.on.t-emploi { background: var(--c); border-color: var(--c); color: var(--surface); }
.tag.done { background: var(--surface-2); color: var(--muted); }
.tag.coopt { background: var(--good-soft); color: var(--good); }
.tag.urgent { background: var(--brass-soft); color: var(--brass); }
.tag.entre { background: var(--accent-soft); color: var(--accent); }
.state-pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; font-weight: 600; padding: .2rem .6rem; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.state-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.s-trouve, .m-terminee { background: var(--good-soft); color: var(--good); }
.s-validation, .m-acceptee { background: var(--brass-soft); color: var(--brass); }
.s-entretiens { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue-text); }
.s-recherche, .m-demande { background: var(--surface-2); color: var(--ink-2); }
.m-refusee { background: var(--bad-soft); color: var(--bad); }
.empty { display: flex; flex-direction: column; align-items: center; gap: .4rem; text-align: center; padding: 2rem 1rem; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); }
.empty strong { color: var(--ink); }
.empty-act { margin-top: .7rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .7rem; min-width: 0; }
.panel .section-head { margin-top: 0; }
.callout { background: var(--accent-soft); border-radius: var(--r); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .5rem; }
.callout h2 { color: var(--accent); }
.todo { list-style: none; margin: 0; padding: 0; }
.two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; align-items: start; }
.two-col > * { min-width: 0; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: visible; }
.bar-fill { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 4px; background: var(--accent); transition: width .5s ease; }
.bar-pace { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-inline-start: -1px; background: var(--ink); border-radius: 1px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: start; font-size: .74rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: .4rem .5rem; border-bottom: 1px solid var(--line); }
.tbl td { padding: .55rem .5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl .num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-cell { width: 40%; vertical-align: middle !important; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: .7rem 1.1rem; border-radius: 10px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); font-weight: 500; animation: pop .25s ease; pointer-events: none; }
.toast.err { background: var(--bad); color: var(--bad-ink); } .toast.win { background: var(--brass); color: var(--surface); }
@keyframes pop { from { transform: translate(-50%, 8px); opacity: .4; } }
.modal-back { position: fixed; inset: 0; z-index: 50; background: rgb(10 12 18 / .45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--surface); border-radius: 14px; box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
.modal.wide { width: min(760px, 100%); }
.modal-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 1.1rem; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 1; }
.modal-body { padding: 1.1rem; display: flex; flex-direction: column; gap: .8rem; }

/* Offres */
.filters { display: flex; flex-direction: column; gap: .7rem; }
.filter-row { display: flex; gap: .5rem; flex-wrap: wrap; }
.filter-row select.fil-filtre { max-width: min(100%, 17rem); text-overflow: ellipsis; }
.search { display: flex; align-items: center; gap: .4rem; flex: 1 1 240px; padding: 0 .7rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); }
.search input { border: 0; padding: .55rem 0; background: transparent; }
.search input:focus-visible { outline: none; }
.feed { display: flex; flex-direction: column; gap: .8rem; }
.offer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.offer.closed { opacity: .78; }
.offer-top { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.offer-title { font-size: 1.12rem; }
.offer-meta { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; color: var(--ink-2); font-size: .9rem; }
.dot { color: var(--muted); }
.offer-target { margin-top: .1rem; }
.offer-desc { color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 75ch; }
.offer-desc.full { display: block; }
.offer-more { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .5rem 1rem; margin: 0; padding: .7rem; background: var(--surface-2); border-radius: 8px; }
.offer-more dt { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.offer-more dd { margin: 0; overflow-wrap: anywhere; }
.offer-author { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; padding-top: .3rem; }
.impact-pill { display: inline-flex; align-items: center; gap: .3rem; font-size: .8rem; font-weight: 600; color: var(--good); background: var(--good-soft); padding: .2rem .55rem; border-radius: 999px; }
.offer-actions { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: .55rem; }
.act { display: inline-flex; align-items: center; gap: .35rem; border: 0; background: none; padding: .35rem .55rem; border-radius: 7px; color: var(--ink-2); font-size: .86rem; font-weight: 500; cursor: pointer; }
.act b { font-family: var(--f-mono); font-weight: 500; }
.act:hover { background: var(--surface-2); }
.act.on { color: var(--accent); background: var(--accent-soft); }
.owner-bar { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; background: var(--surface-2); border-radius: 8px; padding: .4rem .6rem; }
.comments { display: flex; flex-direction: column; gap: .6rem; border-top: 1px solid var(--line); padding-top: .7rem; }
.comment { display: flex; gap: .6rem; align-items: flex-start; }
.comment-body { flex: 1; min-width: 0; } .comment-body p { overflow-wrap: anywhere; }
.comment-form { display: flex; gap: .5rem; }
.cta-post { display: flex; align-items: center; gap: 1rem; justify-content: space-between; flex-wrap: wrap; padding: 1rem 1.1rem; border: 1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); border-radius: var(--r); }

/* Parcours / impact */
.objective { display: flex; gap: 1.2rem; justify-content: space-between; flex-wrap: wrap; padding: 1.2rem 1.3rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); border-inline-start: 5px solid var(--muted); }
.objective.st-trouve { border-inline-start-color: var(--good); } .objective.st-validation { border-inline-start-color: var(--brass); } .objective.st-entretiens { border-inline-start-color: var(--blue); } .objective.st-recherche, .objective.st-candidatures { border-inline-start-color: var(--accent); }
.objective-main { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.objective-state { display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; }
.objective.compact { padding: 1rem 1.1rem; }
.objective.compact .objective-state { flex-direction: row; flex-wrap: wrap; align-items: center; }
.merci-box { display: flex; flex-direction: column; gap: .6rem; padding: 1rem 1.1rem; border-radius: var(--r); background: var(--brass-soft); }
.merci-done { display: flex; align-items: center; gap: .6rem; color: var(--brass); flex-wrap: wrap; }
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; }
.kcol { background: var(--surface-2); border-radius: var(--r); padding: .7rem; display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.kcol h3 { font-size: .9rem; display: flex; align-items: center; gap: .4rem; }
.kcard { background: var(--surface); border-radius: 8px; padding: .65rem; display: flex; flex-direction: column; gap: .3rem; border: 1px solid var(--line); }
.kcard select { font-size: .82rem; padding: .25rem .4rem; }
.timeline { margin: 0; padding-inline-start: 1.1rem; display: flex; flex-direction: column; gap: .4rem; }
.impact-hero { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; gap: 1rem; }
.impact-score { display: flex; flex-direction: column; gap: .5rem; padding: 1.2rem; border-radius: 14px; background: var(--ink); color: var(--bg); }
.impact-score .muted { color: color-mix(in srgb, var(--bg) 70%, var(--ink)); }
.impact-score .bar { background: color-mix(in srgb, var(--bg) 18%, var(--ink)); } .impact-score .bar-fill { background: var(--brass); }
.impact-score .lvl { color: var(--brass-on-ink); background: transparent; }
.big { font-size: 2.2rem; font-weight: 500; line-height: 1; }
.lvl-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.impact-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
.impact-facts > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem 1rem; display: flex; flex-direction: column; gap: .3rem; }
.impact-facts .big { font-size: 1.8rem; color: var(--ink); }
.confirm-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; background: var(--surface); border-radius: 8px; padding: .6rem .7rem; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--sp-4) var(--sp-3); }
.badge { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-1); color: var(--muted); font-size: var(--fs-2); }
.badge strong { color: var(--ink-2); font-size: var(--fs-3); font-weight: 600; line-height: 1.3; }
.badge.has strong { color: var(--ink); }
.badge-medal { display: inline-grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 50%; color: var(--muted); border: 1.5px dashed var(--line-strong); margin-block-end: var(--sp-1); }
.badge.has .badge-medal { border: 0; background: var(--brass-soft); color: var(--brass); }
.badge.has .badge-medal.m-verifie { background: color-mix(in srgb, var(--teal) 14%, var(--surface)); color: var(--teal); }
.badge-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.badge-mini { background: var(--brass-soft); color: var(--brass); display: inline-flex; align-items: center; gap: .3rem; }
.mercis { display: flex; flex-direction: column; gap: .6rem; }
.merci { margin: 0; padding: .7rem .9rem; border-inline-start: 3px solid var(--brass); background: var(--surface-2); border-radius: 0; border-start-end-radius: 8px; border-end-end-radius: 8px; display: flex; flex-direction: column; gap: .3rem; }
.merci p { font-style: italic; color: var(--ink-2); }
.merci-inline { color: var(--brass); display: flex; gap: .3rem; align-items: center; }
.events { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; font-size: .9rem; }
.pts { color: var(--brass); font-weight: 500; }
/* Points d'impact : petite pastille après la phrase (lauréats seulement) */
.pastille-pts { display: inline-block; margin-inline-start: .4rem; padding: 0 .45rem; border-radius: 999px; background: var(--brass-soft); color: var(--brass); font-size: .74rem; font-weight: 600; line-height: 1.5; white-space: nowrap; font-variant-numeric: tabular-nums; }
.notif .pastille-pts { display: inline-block; flex: none; align-self: flex-start; margin-inline-start: 0; }
.toast .pastille-pts { background: none; color: inherit; box-shadow: inset 0 0 0 1px currentColor; }
.fete-pts { margin: .3rem 0 0; }

/* Tableau de bord */
.season-pick { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: .9rem; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem 1rem; display: flex; flex-direction: column; gap: .2rem; min-width: 0; }
.kpi-label { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kpi-val { font-size: 1.9rem; line-height: 1.1; } .kpi-val small { font-size: 1rem; color: var(--muted); }
.niv-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; }
.niv-card { text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem; display: flex; flex-direction: column; gap: .6rem; cursor: pointer; min-width: 0; color: inherit; }
.niv-card:hover { border-color: var(--ink-2); }
.niv-card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.niv-top { display: flex; align-items: center; justify-content: space-between; gap: .4rem; flex-wrap: wrap; }
.niv-badge { font: 600 .78rem/1 var(--f-mono); padding: .3rem .45rem; border-radius: 6px; background: var(--ink); color: var(--bg); flex: none; }
.niv-obj { font-size: .92rem; }
.niv-num { display: flex; flex-direction: column; gap: .15rem; }
.niv-num .big { font-size: 1.8rem; }
.status { display: inline-flex; align-items: center; gap: .3rem; font-size: .76rem; font-weight: 600; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.s-good { color: var(--good); } .s-warn { color: var(--warn); } .s-bad { color: var(--bad); }
.legend { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.lg-fill { width: 18px; height: 8px; border-radius: 4px; background: var(--accent); display: inline-block; }
.lg-pace { width: 2px; height: 14px; background: var(--ink); display: inline-block; margin-inline-start: .6rem; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; } .sw.s1 { background: var(--s1); } .sw.s2 { background: var(--s2); margin-inline-start: .5rem; }
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; min-width: 520px; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 11px var(--f-body); }
.chart rect.s1 { fill: var(--s1); } .chart rect.s2 { fill: var(--s2); }
.chart rect:hover { opacity: .8; }
.rank { margin: 0; padding: 0; list-style: none; counter-reset: r; display: flex; flex-direction: column; }
.rank li { display: flex; justify-content: space-between; gap: 1rem; padding: .45rem 0; border-bottom: 1px solid var(--line); counter-increment: r; }
.rank li::before { content: counter(r); font: 500 .8rem var(--f-mono); color: var(--muted); width: 1.4rem; }
.rank li span:first-of-type { flex: 1; }
.people-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.people-list li { display: flex; align-items: center; gap: .6rem; justify-content: space-between; flex-wrap: wrap; padding: .5rem 0; border-bottom: 1px solid var(--line); }

/* Accueil */
.hello { display: flex; flex-direction: column; gap: .2rem; padding-top: .3rem; }
.hello h1 { font-size: clamp(1.9rem, 1.3rem + 2vw, 2.8rem); }
.impact-strip { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; padding: .8rem 1rem; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
.home-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 1.2rem; align-items: start; }
.home-main, .home-side { display: flex; flex-direction: column; gap: .8rem; min-width: 0; }
.home-main .section-head { margin-top: 0; }
.pulse-row { display: flex; align-items: center; gap: .7rem; }
.pulse-bar { flex: 1; display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.star { background: linear-gradient(180deg, var(--brass-soft), var(--surface)); }

/* Mentorat / Entraide / Communauté */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: .7rem; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem; display: flex; flex-direction: column; gap: .5rem; min-width: 0; align-items: flex-start; }
.mcard .row { width: 100%; }
.topics { font-size: .88rem; }
.list { display: flex; flex-direction: column; gap: .6rem; }
.mrow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem 1rem; display: flex; flex-direction: column; gap: .5rem; }
.mrow-head { display: flex; align-items: center; gap: .6rem; }
.quote { color: var(--ink-2); border-inline-start: 3px solid var(--line); padding-inline-start: .7rem; }
.qrow { display: flex; align-items: center; gap: 1rem; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .8rem 1rem; cursor: pointer; color: inherit; width: 100%; }
.qrow:hover { border-color: var(--ink-2); }
.qcount { display: flex; flex-direction: column; align-items: center; min-width: 64px; padding: .35rem; border-radius: 8px; border: 1px solid var(--line); font-size: .72rem; color: var(--muted); }
.qcount b { font-size: 1.1rem; color: var(--ink); }
.qcount.solved { background: var(--good-soft); border-color: transparent; color: var(--good); } .qcount.solved b { color: var(--good); }
.qtxt { display: flex; flex-direction: column; gap: .15rem; flex: 1; min-width: 0; }
.qview { display: flex; flex-direction: column; gap: .6rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.2rem; }
.answer { display: flex; gap: .8rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem 1rem; }
.answer.best { border-color: var(--good); box-shadow: 0 0 0 1px var(--good); }
.answer-body { flex: 1; display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.vote { display: flex; flex-direction: column; align-items: center; gap: .1rem; }
.best-tag { color: var(--good); font-size: .8rem; font-weight: 600; display: inline-flex; gap: .3rem; align-items: center; }
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
.board li { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .6rem .9rem; }
.board .rank-n { width: 2rem; font-size: 1rem; color: var(--muted); }
.board .podium .rank-n { color: var(--brass); font-weight: 500; }
.board .p1 { border-color: color-mix(in srgb, var(--brass) 50%, transparent); background: var(--brass-soft); }
.board-facts { flex: 1; text-align: end; }
.dir { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: .5rem; }
.dir li { display: flex; flex-direction: column; gap: .2rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .7rem .8rem; min-width: 0; }
.profile { display: flex; flex-direction: column; gap: .7rem; }
.profile-head { display: flex; gap: 1rem; align-items: center; }
.profile-stats { display: flex; gap: 1.2rem; flex-wrap: wrap; font-size: .88rem; color: var(--ink-2); }
.profile-stats b { color: var(--ink); font-size: 1.05rem; }

/* Connexion */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; padding-block: 2rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1080px; margin: 0 auto; }
.auth-side { display: flex; flex-direction: column; gap: 1rem; }
.auth-side h1 { font-size: clamp(2rem, 1.4rem + 2.5vw, 3.2rem); }
.auth-side p { color: var(--ink-2); max-width: 46ch; }
.auth-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; color: var(--ink-2); }
.auth-points li { display: flex; gap: .6rem; align-items: center; }
.auth-points .ico { color: var(--accent); }
.auth-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.5rem; box-shadow: var(--shadow); }
.auth-card.wide { grid-column: 1 / -1; max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: .8rem; }
.auth-links { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: .9rem; }
.auth-msg { padding: .6rem .8rem; border-radius: 8px; background: var(--good-soft); color: var(--good); font-size: .9rem; }
.auth-msg.err { background: var(--bad-soft); color: var(--bad); }
.boot, .fatal { min-height: 60vh; display: grid; place-content: center; gap: .6rem; text-align: center; padding: 2rem 16px; color: var(--muted); }

/* ===== v2 : marque, menus, cartes d'offres, fiche, parcours ===== */
.brand { text-decoration: none; color: inherit; }
.brand-logo { flex: none; display: block; }
.nav-ico { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); flex: none; }
.side-nav a.on .nav-ico { background: var(--accent); color: var(--accent-ink); }
.side-nav { gap: 4px; }
.side-nav a { padding: .45rem .6rem; }
.pop-wrap, .menu-wrap { position: relative; }
.menu-pop { position: absolute; inset-inline-end: 0; top: calc(100% + 6px); min-width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 10px 30px rgb(0 0 0 / .15); padding: .35rem; display: flex; flex-direction: column; z-index: 45; }
.menu-pop button { display: flex; align-items: center; gap: .6rem; padding: .55rem .6rem; border: 0; background: none; text-align: start; border-radius: 7px; cursor: pointer; font-weight: 500; }
.menu-pop button:hover { background: var(--surface-2); }
.menu-who { display: flex; flex-direction: column; padding: .45rem .6rem .6rem; border-bottom: 1px solid var(--line); margin-bottom: .3rem; }
.n-ico { display: inline-grid !important; place-items: center; flex: none !important; width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); }
.n-ico.accent { background: var(--accent-soft); color: var(--accent); } .n-ico.good { background: var(--good-soft); color: var(--good); } .n-ico.brass { background: var(--brass-soft); color: var(--brass); }
.notif .ico:last-child { align-self: center; color: var(--muted); flex: none; }
.demo-band { display: flex; align-items: center; gap: .5rem; }
.demo-band .ico { flex: none; }
.toolbar { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.toolbar .search { flex: 1 1 220px; }
.btn.on { background: var(--accent-soft); color: var(--accent); }
.grow { flex: 1; }
.center { text-align: center; }
.nowrap { flex-wrap: nowrap; white-space: nowrap; }
.clickable { cursor: pointer; text-align: start; font: inherit; color: inherit; width: 100%; }
.h-ico { display: inline-flex; align-items: center; gap: .45rem; }
.warn-t { color: var(--warn); display: inline-flex; align-items: center; gap: .35rem; }
.hint { display: flex; align-items: center; gap: .4rem; }

/* Logos d'entreprise (monogrammes) */
.clogo { display: inline-grid; place-items: center; flex: none; overflow: hidden; border-radius: 28%; font: 700 1rem/1 var(--f-display); letter-spacing: .01em; color: hsl(var(--h, 205) var(--s2, 58%) 28%); background: hsl(var(--h, 205) var(--s, 50%) 93%); }
.clogo.c-img { background: var(--tuile-logo); box-shadow: inset 0 0 0 1px var(--tuile-filet); padding: 0; }
.clogo.c-img img { width: 76%; height: 76%; object-fit: contain; border-radius: 12%; }
.clogo.c-large img { width: 92%; height: 92%; }

/* Cartes d'offres */
.offer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: .8rem; }
.offer-grid.one { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.offer-grid > .empty { grid-column: 1 / -1; }
.ocard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-width: 0; transition: border-color .15s, box-shadow .15s, transform .15s; }
.ocard:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: var(--shadow); transform: translateY(-1px); }
.ocard.closed { opacity: .7; }
.ocard-main { display: flex; gap: .8rem; align-items: flex-start; padding: 1rem 1rem .7rem; border: 0; background: none; text-align: start; cursor: pointer; color: inherit; flex: 1; min-width: 0; border-radius: 14px 14px 0 0; }
.ocard-txt { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.ocard-tags { display: flex; gap: .3rem; flex-wrap: wrap; }
.ocard-title { font: 600 1.02rem/1.3 var(--f-display); letter-spacing: -.01em; }
.ocard-meta { color: var(--muted); font-size: .86rem; }
.ocard-foot { display: flex; align-items: center; gap: .5rem; padding: .5rem 1rem .6rem; border-top: 1px solid var(--line); min-height: 44px; }
.ocard-author { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; color: var(--ink-2); min-width: 0; }
.ocard-author span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.a-postule { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue-text); }
.a-entretien { background: var(--brass-soft); color: var(--brass); }
.a-retenu { background: var(--good-soft); color: var(--good); }
.a-refuse { background: var(--surface-2); color: var(--muted); }

/* Fiche d'une offre */
.detail { display: flex; flex-direction: column; gap: 1rem; }
.detail-head { display: flex; gap: .9rem; align-items: flex-start; }
.detail-title { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .35rem; align-items: flex-start; }
.detail-title h2 { font-size: 1.3rem; font-weight: 750; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .6rem; margin: 0; }
.facts > div { background: var(--surface-2); border-radius: 10px; padding: .6rem .75rem; min-width: 0; }
.facts dt { display: flex; align-items: center; gap: .35rem; font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.facts dd { margin: .15rem 0 0; font-weight: 500; overflow-wrap: anywhere; }
.prose { color: var(--ink-2); max-width: 70ch; white-space: pre-line; }
.author-box { display: flex; flex-direction: column; gap: .5rem; padding: .8rem .9rem; border: 1px solid var(--line); border-radius: 12px; }
.apply-box { display: flex; flex-direction: column; gap: .6rem; padding: 1rem; border-radius: 12px; background: var(--accent-soft); }
.apply-box.cta { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .8rem; }
.apply-box textarea { background: var(--surface); }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: .4rem; flex-wrap: wrap; }
.stepper li { display: flex; align-items: center; gap: .4rem; font-size: .88rem; font-weight: 600; color: var(--muted); }
.stepper li + li::before { content: ""; width: 22px; height: 2px; background: var(--line); border-radius: 1px; }
.stepper li.done { color: var(--ink); }
.stepper li.done + li.done::before { background: var(--good); }
.step-dot { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); font: 600 .75rem/1 var(--f-mono); }
.stepper li.done .step-dot { background: var(--good); border-color: var(--good); color: #fff; }
.cands { display: flex; flex-direction: column; gap: .7rem; align-items: stretch; }
.cands > .btn { align-self: flex-start; }
.cand { border: 1px solid var(--line); border-radius: 12px; padding: .8rem .9rem; display: flex; flex-direction: column; gap: .6rem; }
.cand-head { display: flex; align-items: flex-start; gap: .5rem; }
.cand-head .person { flex: 1; min-width: 0; }
.cand-quand { flex: none; white-space: nowrap; padding-block-start: .2rem; }
.cand-etats, .cand-actions, .cand-statut { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.cand-etats .state-pill { white-space: normal; max-width: 100%; }
.cand-etats .state-pill::before { flex-shrink: 0; }
.cand .cand-actions .btn { min-height: 40px; }
.cand .cand-actions .cand-annuler { color: var(--bad); }
.cand-statut { gap: .5rem; }
.cand-recruter { background: var(--good); border-color: var(--good); color: var(--surface); }
.cand-recruter:hover { filter: brightness(1.08); border-color: var(--good); }
/* Téléphone : deux gros boutons côte à côte, les statuts sur une ligne qui prend toute la largeur, « Recruter » en dessous */
@media (max-width: 599px) {
  .cand .cand-actions .btn { flex: 1 1 auto; min-height: 44px; }
  .cand .cand-actions .btn.cand-annuler { flex-basis: 100%; }
  .cand-statut { flex-direction: column; align-items: stretch; }
  .cand-statut .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-self: stretch; }
  .cand-statut .seg.small-seg button { min-height: 44px; padding-inline: .3rem; }
  .cand .btn.cand-recruter { min-height: 44px; }
}
.seg.small-seg button { padding: .3rem .65rem; font-size: .82rem; }
.seg .seg-accent { background: var(--good); color: #fff; display: inline-flex; align-items: center; gap: .3rem; }
.seg .seg-accent:hover { filter: brightness(1.08); }
.type-pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; }
.type-opt { display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: .8rem .4rem; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .86rem; color: var(--ink-2); }
.type-opt .ico { color: var(--c); }
.type-opt.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--surface)); color: var(--ink); box-shadow: 0 0 0 1px var(--c); }
.more-fields { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; }
.more-fields summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.more-fields[open] summary { margin-bottom: .7rem; }

/* Parcours */
.objective { flex-direction: column; flex-wrap: nowrap; gap: 1rem; }
button.objective { border-top: 1px solid var(--line); border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.objective-top { display: flex; align-items: flex-start; gap: .9rem; }
.objective-top .objective-main { flex: 1; }
.obj-ico { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); flex: none; }
.obj-ico.brass { background: var(--brass-soft); color: var(--brass); width: 38px; height: 38px; }
.journey { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.journey li { display: flex; flex-direction: column; align-items: center; gap: .35rem; text-align: center; position: relative; font-size: .8rem; color: var(--muted); font-weight: 500; }
.journey li::before { content: ""; position: absolute; top: 17px; inset-inline-start: -50%; width: 100%; height: 3px; background: var(--line); z-index: 0; }
.journey li:first-child::before { display: none; }
.journey li.done::before, .journey li.next::before { background: var(--good); }
.journey li.next::before { background: linear-gradient(90deg, var(--good), var(--line)); }
.j-dot { position: relative; z-index: 1; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); color: var(--muted); }
.journey li.done .j-dot { background: var(--good); border-color: var(--good); color: #fff; }
.journey li.done { color: var(--ink); }
.journey li.next .j-dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.journey li.next { color: var(--accent); font-weight: 600; }
.found-line { display: flex; align-items: center; gap: .7rem; padding: .7rem .8rem; border-radius: 10px; background: var(--good-soft); }
.confirm-card { display: flex; flex-direction: column; gap: .8rem; padding: 1.1rem 1.2rem; border-radius: 14px; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.confirm-top { display: flex; gap: .9rem; align-items: flex-start; }
.confirm-top h2 { font-size: 1.12rem; margin-bottom: .2rem; }
.confirm-card .eyebrow { color: var(--accent); }
.app-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
.app-row { display: flex; align-items: center; gap: .75rem; padding: .7rem .8rem; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
button.app-row:hover { border-color: var(--ink-2); }
.app-list.flat .app-row { background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding-inline: 0; }
.app-list.flat li:last-child .app-row { border-bottom: 0; }
.app-txt { display: flex; flex-direction: column; gap: .1rem; flex: 1; min-width: 0; }
.app-txt.right { text-align: end; }
.app-txt .linkish { text-align: start; font-family: var(--f-display); font-size: .98rem; }
.app-row select { font-size: .84rem; padding: .3rem .45rem; }
.type-ico { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); flex: none; }
.mini-stats { display: inline-flex; gap: .7rem; color: var(--ink-2); font: 500 .85rem var(--f-mono); }
.mini-stats span { display: inline-flex; align-items: center; gap: .25rem; }
.stars { display: inline-flex; gap: 2px; }
.stars button { border: 0; background: none; font-size: 1.35rem; line-height: 1; color: color-mix(in srgb, var(--brass) 30%, transparent); cursor: pointer; padding: 0 1px; }
.stars button.on { color: var(--brass); }
.merci-box p { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.merci-box textarea { background: var(--surface); }
.accent-panel { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.impact-score > .row { color: var(--brass-on-ink); }
.linkish.on-dark { color: var(--brass-on-ink); }
.impact-facts > div { position: relative; }
.fact-ico { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--brass-soft); color: var(--brass); }

/* Réseau */
.sub-page { display: flex; flex-direction: column; gap: .9rem; }
.sub-page > .search { flex: none; }
.icon-tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(76px, 1fr); gap: .5rem; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
.icon-tabs::-webkit-scrollbar { display: none; }
.icon-tabs button { scroll-snap-align: start; }
.icon-tabs button { position: relative; display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: .7rem .3rem; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: .86rem; cursor: pointer; }
.icon-tabs button:hover { border-color: var(--ink-2); }
.icon-tabs button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.icon-tabs .dotn { position: absolute; top: 8px; inset-inline-end: 10px; margin: 0; }
.back { align-self: flex-start; }
.q-title { font-size: 1.4rem; font-weight: 750; }
.medal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: .8rem; }
.medal.m1 { background: #C9971C; } .medal.m2 { background: #8C96A5; } .medal.m3 { background: #A86A3D; }
.board-facts { display: inline-flex; gap: .8rem; justify-content: flex-end; }
.board-facts span { display: inline-flex; align-items: center; gap: .25rem; }
.qtxt .mini { align-self: flex-start; }
.mcard .small { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }

/* Accueil */
.shortcuts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
.shortcut { display: flex; flex-direction: column; align-items: flex-start; gap: .25rem; padding: .9rem; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: start; color: inherit; transition: border-color .15s, transform .15s; min-width: 0; }
.shortcut:hover { border-color: var(--accent); transform: translateY(-1px); }
.shortcut strong { font-family: var(--f-display); font-size: .98rem; margin-top: .3rem; }
.sc-ico { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); flex: none; }
.shortcut:nth-child(2) .sc-ico { background: color-mix(in srgb, var(--teal) 14%, transparent); color: var(--teal); }
.shortcut:nth-child(3) .sc-ico { background: color-mix(in srgb, var(--indigo) 14%, transparent); color: var(--indigo); }
.shortcut:nth-child(4) .sc-ico { background: var(--brass-soft); color: var(--brass); }
button.impact-strip, button.panel { font: inherit; color: inherit; text-align: start; cursor: pointer; width: 100%; }
button.panel:hover, button.impact-strip:hover, button.objective:hover { border-color: var(--ink-2); }
.panel.pulse .section-head { width: 100%; }
.panel.pulse { align-items: stretch; }
.star .eyebrow { display: inline-flex; align-items: center; gap: .3rem; color: var(--brass); }
.bn-ico { position: relative; display: inline-flex; }
.bn-ico .dotn { position: absolute; top: -2px; inset-inline-end: -6px; margin: 0; }
.auth-points .sc-ico { width: 34px; height: 34px; border-radius: 10px; }
.auth-points .sc-ico .ico { color: var(--accent); }

/* Icône ronde des étapes (installation) et vue promo (étudiants) */
.g-ico { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.promo-hero { display: flex; gap: 1rem; align-items: flex-start; padding: 1.2rem; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.promo-hero > div { flex: 1; display: flex; flex-direction: column; gap: .5rem; }
.promo-hero .big small { font-size: 1.1rem; color: var(--muted); }
.company-cloud { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .5rem; }
.company-cloud li { display: flex; align-items: center; gap: .6rem; }
.company-cloud li span:nth-child(2) { flex: 1; }

@media (max-width: 1000px) {

:root[dir="rtl"] {

/* Le texte des membres (souvent en français) s'aligne selon sa propre langue (dir="auto") ; un champ vide garde le sens de l'interface pour son exemple */
[dir="rtl"] :is(input, textarea)[dir="auto"]:placeholder-shown { direction: rtl; }
/* Arabe lisible : pas de petites étiquettes sous 13 px, pas de lettres penchées (l'arabe n'a pas d'italique, le navigateur la fabrique) */

  --sky-1: #050D1A; --sky-2: #17304F; --sun: #EFE9D6; --cloud: #22385A; --mtn: #0E1E35; --hill: #112640;
  --bldg: #1D2F48; --bldg-top: #15243A; --bldg-shade: #18293F; --win: #F4C46A; --tree-1: #1D4A37; --tree-2: #15392A; --tree-hi: #24573F; --trunk: #3E3226;

.scene { position: relative; overflow: hidden; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.scene .sun, .scene .sun-st { fill: var(--sun); stop-color: var(--sun); }
.scene .crater { fill: #9C9480; opacity: var(--crater); }
.scene .sc-stars { fill: #FFFFFF; opacity: var(--stars); }
.scene .cl { fill: var(--cloud); }
.scene .bird { fill: none; stroke: var(--bird); stroke-width: 1.6; stroke-linecap: round; }
.scene .mtn { fill: var(--mtn); } .scene .hill-1 { fill: var(--hill); }
.scene .b-body { fill: var(--bldg); } .scene .b-top, .scene .roof { fill: var(--bldg-top); } .scene .b-shade { fill: var(--bldg-shade); } .scene .b-win { fill: var(--win); }
.scene .t-1 { fill: var(--tree-1); } .scene .t-2 { fill: var(--tree-2); } .scene .t-hi { fill: var(--tree-hi); opacity: .55; } .scene .t-trunk { fill: var(--trunk); }
.scene .t-stem { fill: none; stroke: var(--trunk); stroke-width: 4; stroke-linecap: round; }
.scene .t-palm { fill: none; stroke: var(--tree-1); stroke-width: 4; stroke-linecap: round; }
.scene .hedge { fill: var(--hedge); } .scene .bed { fill: var(--bed); }
.scene .lawn-1 { stop-color: var(--lawn-1); } .scene .lawn-2 { stop-color: var(--lawn-2); }
.scene .lawn-line { stroke: var(--lawn-1); stroke-width: 2; opacity: .5; fill: none; }
.scene .walk { fill: var(--walk); } .scene .walk-edge { fill: none; stroke: var(--walk-edge); stroke-width: 2; }
.scene .fl1 { fill: var(--fl-1); } .scene .fl2 { fill: var(--fl-2); } .scene .fl3 { fill: var(--fl-3); }
.scene .iron { fill: var(--iron); } .scene .lamp-bulb { fill: #FFE7A8; } .scene .lamp-glow { opacity: var(--lamp); }
.scene .g-frame, .scene .g-pillar { fill: var(--gate); } .scene .g-in, .scene .g-band { fill: var(--gate-in); }
.scene .g-band { stroke: var(--gate); stroke-width: 2.5; }
.scene .g-txt { fill: var(--gate); font: 700 10.5px var(--f-display); letter-spacing: 3px; }
.scene .sc-gate { --em-o: #F39200; --em-b: #1B7DBF; --em-n: #1F3354; }
.scene .w-leg, .scene .w-head { fill: var(--w-skin); } .scene .w-head { fill: var(--w-hair); }
.scene .w1 .w-body { fill: var(--w-body-1); } .scene .w1 .w-bag { fill: var(--w-body-2); }
.scene .w2 .w-body { fill: var(--w-body-2); } .scene .w2 .w-bag { fill: var(--gate); }
.scene .w-leg { fill: #2A3550; }

/* Mouvement de la scène */
.scene .sc-cloud { animation: sc-drift 110s linear infinite; }
.scene .sc-cloud.c1 { animation-delay: -40s; } .scene .sc-cloud.c2 { animation-duration: 150s; animation-delay: -95s; } .scene .sc-cloud.c3 { animation-duration: 130s; animation-delay: -10s; } .scene .sc-cloud.c4 { animation-duration: 170s; animation-delay: -60s; }
@keyframes sc-drift { from { transform: translateX(-700px); } to { transform: translateX(1300px); } }
.scene .sc-halo { transform-box: fill-box; transform-origin: center; animation: sc-glow 5s ease-in-out infinite alternate; }
@keyframes sc-glow { to { transform: scale(1.12); opacity: .7; } }
.scene .sc-stars circle { animation: sc-twinkle 3.2s ease-in-out infinite alternate; }
@keyframes sc-twinkle { to { opacity: .25; } }
.scene .sc-birds { animation: sc-fly 34s linear infinite; animation-delay: -8s; }
@keyframes sc-fly { from { transform: translate(-200px, 150px); } to { transform: translate(1000px, 40px); } }
.scene .bird { transform-box: fill-box; transform-origin: center; animation: sc-flap .5s ease-in-out infinite alternate; }
.scene .bird:nth-child(2) { animation-delay: -.2s; } .scene .bird:nth-child(3) { animation-delay: -.35s; }
@keyframes sc-flap { to { transform: scaleY(-.5); } }
.scene .sc-tree { transform-box: fill-box; transform-origin: 50% 100%; animation: sc-sway 7s ease-in-out infinite alternate; }
.scene .sc-tree.palm { animation-duration: 5s; }
@keyframes sc-sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
.scene .sc-leaf { transform-box: fill-box; transform: scaleX(.14); }
.scene .sc-leaf.l { transform-origin: 0 50%; } .scene .sc-leaf.r { transform-origin: 100% 50%; }
.scene.opening .sc-leaf { animation: sc-open 1.8s cubic-bezier(.65, 0, .35, 1) .7s backwards; }
@keyframes sc-open { from { transform: scaleX(1); } }
.scene.opening .sc-row { transform-box: fill-box; transform-origin: center bottom; animation: sc-bloom .7s var(--ease) backwards; }
@keyframes sc-bloom { from { transform: scale(.2); opacity: 0; } }
.scene .sc-walk { opacity: 0; animation: sc-walk 18s cubic-bezier(.3, .55, .5, 1) infinite; }
.scene .sc-walk.w1 { --x0: 372px; --x1: 397px; } .scene .sc-walk.w2 { --x0: 432px; --x1: 404px; }
@keyframes sc-walk { 0% { transform: translate(var(--x0), 420px) scale(1.05); opacity: 0; } 5% { opacity: 1; } 82% { opacity: 1; } 100% { transform: translate(var(--x1), 304px) scale(.24); opacity: 0; } }
.scene .sc-step { animation: sc-bob .42s ease-in-out infinite alternate; }
@keyframes sc-bob { to { transform: translateY(-1.6px); } }
.scene .w-leg { transform-box: fill-box; transform-origin: top; animation: sc-leg .42s ease-in-out infinite alternate; }
.scene .w-leg.l2 { animation-delay: -.42s; }
@keyframes sc-leg { to { transform: scaleY(.72); } }
.scene .lamp-glow { transform-box: fill-box; transform-origin: center; animation: sc-glow 3s ease-in-out infinite alternate; }
.scene[data-paused] *, .scene[data-paused], .scene[data-pose] *, .scene[data-pose] { animation-play-state: paused !important; }

/* Accueil : bandeau avec l'école */

.home-hero .scene { position: absolute; inset: 0; }

/* Accueil : deux passants franchissent la porte une fois, puis l'entrée se pose (plus de boucle en fond) */

.home-hero .scene .sc-walk.w2 { animation-delay: 1.5s !important; }

/* Connexion */
.auth { max-width: 1180px; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: 2.4rem; align-items: stretch; }

.auth-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 5px; background: linear-gradient(90deg, var(--em-o) 0 36%, var(--em-b) 36% 100%); }
[dir="rtl"] .auth-card::before { background: linear-gradient(270deg, var(--em-o) 0 36%, var(--em-b) 36% 100%); }
.auth-card.wide { animation: none; }
.auth-points { gap: .7rem; padding-inline: .3rem; }
.auth-points li { animation: rise .6s var(--ease) backwards; }
.auth-points li:nth-child(1) { animation-delay: .35s; } .auth-points li:nth-child(2) { animation-delay: .43s; } .auth-points li:nth-child(3) { animation-delay: .51s; } .auth-points li:nth-child(4) { animation-delay: .59s; }

.auth-points li:nth-child(4) .sc-ico { background: var(--brass-soft); } .auth-points li:nth-child(4) .sc-ico .ico { color: var(--brass); }
.auth-pour { display: flex; flex-direction: column; gap: 1.1rem; }

.auth-pour h2.eyebrow { margin: 0 0 .5rem; padding-inline: .3rem; font-size: .78rem; }
/* ---------- Page d'entrée du visiteur (AuthScreen) : promesse, chiffres vrais, rôle au-dessus de l'email ----------
   Téléphone d'abord : une colonne, le ciel derrière la marque et la promesse, le formulaire sans cadre, l'entrée dessinée en bas.
   Ordinateur (900 px et plus) : la promesse, les bénéfices et l'entrée dessinée à gauche dans le ciel, le formulaire large à droite. */
.auth.entree { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "promesse" "form" "pour" "scene" "pied"; align-items: start; gap: 0; max-width: 620px; min-height: 100vh; padding-block: 0; }
.entree-ciel { grid-row: 1 / 3; grid-column: 1 / -1; align-self: stretch; margin-inline: -16px; border-end-start-radius: 24px; border-end-end-radius: 24px; }
.entree-top { grid-area: top; position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: .8rem; padding-block: calc(10px + env(safe-area-inset-top, 0px)) 0; }
.entree-marque { display: inline-flex; align-items: center; gap: .55rem; font: 700 1rem/1.2 var(--f-display); color: var(--ink); }
.entree-promesse { grid-area: promesse; position: relative; z-index: 1; display: flex; flex-direction: column; gap: .45rem; padding-block: .9rem 1rem; }
.entree-promesse h1 { margin: 0; font-size: clamp(1.7rem, 1.25rem + 2vw, 3rem); line-height: 1.12; max-width: 17ch; text-wrap: balance; }
.auth-chiffres { display: flex; flex-wrap: wrap; min-height: 1.6em; margin: 0; font: 650 .9rem/1.6 var(--f-body); font-variant-numeric: tabular-nums; color: var(--ink); transition: opacity .3s; }
.auth-chiffres:empty { opacity: 0; }
.auth-chiffres span { white-space: nowrap; }
.auth-chiffres span:not(:last-child)::after { content: "·"; margin-inline: .4em; color: var(--muted); }
.entree-sous { margin: 0; color: var(--ink-2); max-width: 46ch; }
/* Lien d'invitation d'une promo, et lien partagé : la ligne d'accueil de l'entrée et son rappel à la « Dernière étape » */

.lien-accueil { display: flex; align-items: flex-start; gap: .5rem; margin: 0; padding: .45rem .7rem; min-block-size: calc(2.7em + .9rem + 2px); max-inline-size: 46ch; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); background: color-mix(in srgb, var(--surface) 82%, transparent); color: var(--ink); font: 600 .92rem/1.35 var(--f-body); }

.auth-card.entree-form { grid-area: form; display: flex; flex-direction: column; gap: .9rem; margin-block-start: .9rem; padding: 0; border: 0; box-shadow: none; background: none; overflow: visible; animation: none; }

/* Cartes du rôle, version entrée : côte à côte même à 360 px, sélection = bordure + tuile pleine (pas de coche) */

/* Coque : marque, navigation, boutons */
.side { gap: 1.4rem; }

:is(.offer-grid, .cards, .shortcuts, .kpis, .niv-grid, .board, .dir, .badges, .impact-facts, .app-list) > :nth-child(4) { animation-delay: .3s; }
:is(.offer-grid, .cards, .shortcuts, .kpis, .niv-grid, .board, .dir, .badges, .impact-facts, .app-list) > :nth-child(5) { animation-delay: .36s; }
:is(.offer-grid, .cards, .shortcuts, .kpis, .niv-grid, .board, .dir, .badges, .impact-facts, .app-list) > :nth-child(n+6) { animation-delay: .42s; }
