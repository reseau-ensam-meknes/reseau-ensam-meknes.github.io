.auth-pied a { color: var(--ink-2); }
/* Cartes du rôle, version entrée : côte à côte même à 360 px, sélection = bordure + tuile pleine (pas de coche) */
.je-suis.compact legend { font: 650 1.1rem/1.3 var(--f-display); margin-block-end: .5rem; }
.je-suis.compact .je-suis-choix { grid-template-columns: 1fr 1fr; gap: .6rem; }
.je-suis.compact .je-carte { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: .3rem .55rem; padding: .7rem .75rem .75rem; }
.je-suis.compact .je-ico { width: 30px; height: 30px; border-radius: 9px; margin: 0; }
.je-suis.compact .je-carte strong { font-size: 1rem; }
.je-suis.compact .je-carte .small { grid-column: 1 / -1; line-height: 1.35; }
.je-suis.compact .je-coche { display: none; }
/* Téléphone : le rôle, l’email et « Recevoir mon code » tiennent dans le premier écran, même avec une police large */
@media (max-width: 899px) {

  .je-suis.compact legend { margin-block-end: .4rem; }

  .je-suis.compact .je-carte strong { line-height: 1.2; text-wrap: balance; }
}
@media (min-width: 900px) {
  .auth.entree { max-width: 1180px; grid-template-columns: minmax(0, 1fr) minmax(400px, 480px); grid-template-rows: auto auto auto 1fr auto; grid-template-areas: "top top" "promesse form" "pour form" "scene form" "pied pied"; column-gap: 2.6rem; padding-block: 1.4rem 0; }
  .entree-ciel { grid-row: 1 / 5; grid-column: 1; margin: 0; border-radius: 26px; border: 1px solid color-mix(in srgb, var(--accent) 16%, var(--line)); }
  .entree-top { padding: 1.6rem 0 0; padding-inline-start: 2.4rem; }
  .entree-promesse { padding: 1.8rem 2.4rem 0; gap: .7rem; }
  .entree .auth-pour { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; margin: 0; padding: 1.8rem 2.4rem 0; position: relative; z-index: 1; }
  .entree-scene { align-self: end; margin: 1.2rem 0 0; position: relative; z-index: 1; border-end-start-radius: 26px; border-end-end-radius: 26px; overflow: hidden; content-visibility: visible; }
  .entree-scene.sky { background: none; }
  .entree-scene .scene { height: 290px; }
  .auth-card.entree-form { align-self: start; position: sticky; top: 1.4rem; margin: 0; padding: 1.8rem 1.8rem 1.5rem; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .auth-card.entree-form::before { display: block; }
}
@media (prefers-reduced-motion: reduce) { .auth-chiffres { transition: none; } }
/* Avant l'application : le visiteur attend la page d'entrée, pas le logo ; le texte du logo suit la langue */
html[data-entree="visiteur"] #app > .boot { display: none; }

/* Sur téléphone, l'entrée dessinée est une bande basse : les oiseaux y seraient coupés au bord */
@media (max-width: 899px) { .entree-scene .sc-birds { display: none; } }
@media (prefers-reduced-motion: reduce) { .scene .sc-birds { display: none; } }
.entree .auth-links { justify-content: center; }
.au-sans-mdp { margin: -.35rem 0 0; text-align: center; }
/* « Tu es… » : étudiant(e) ou lauréat(e) (page d'entrée et étape « Présente-toi ») */
.pf-plus { display: flex; flex-direction: column; align-items: flex-start; gap: .25rem; }
.je-suis { border: 0; padding: 0; margin: 0; min-width: 0; }
.je-suis legend { font-weight: 650; font-size: 1.05rem; margin-bottom: .55rem; padding: 0; }
.je-suis-choix { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
.je-carte { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: .25rem; padding: .95rem 1rem; text-align: start; font: inherit; color: inherit; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; cursor: pointer; transition: border-color .15s, background-color .15s, transform .15s; }
.je-carte:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.je-carte:active { transform: scale(.985); }
.je-carte.on { border-color: var(--accent); background: var(--sel-bg); }
.je-carte strong { font-size: 1.02rem; }
.je-ico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); margin-bottom: .2rem; }
.je-carte.on .je-ico { background: var(--accent); color: var(--accent-ink); }
.je-coche { position: absolute; top: .6rem; inset-inline-end: .6rem; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); opacity: 0; transform: scale(.6); transition: opacity .15s, transform .15s; }
.je-carte.on .je-coche { opacity: 1; transform: none; }
@media (max-width: 380px) { .je-suis:not(.compact) .je-suis-choix { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { .je-carte, .je-coche { transition: none; } }
/* Code à 6 chiffres reçu par email : un seul champ (collage, remplissage automatique, lecteurs d'écran) */
.code-otp { display: block; inline-size: 100%; max-inline-size: 15rem; margin-inline: auto; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 1.75rem; letter-spacing: .45em; text-align: center; padding-block: .5rem; padding-inline: .45em 0; }
.code-otp::placeholder { color: color-mix(in srgb, var(--muted) 45%, transparent); }
[dir="rtl"] .code-otp, [dir="rtl"] .code-otp::placeholder { letter-spacing: .45em !important; }
.au-adresse { display: flex; flex-wrap: wrap; align-items: baseline; gap: .2rem .7rem; margin: -.4rem 0 0; }

.au-code-pied { display: flex; flex-direction: column; align-items: center; gap: .35rem; margin: 0; font-size: .9rem; text-align: center; }

/* Coque : marque, navigation, boutons */
.side { gap: 1.4rem; }
.side-nav a { transition: background .2s, color .2s; }
.side-nav a .nav-ico { transition: background .25s, color .25s, transform .3s var(--ease); }
.side-nav a:hover .nav-ico { transform: translateY(-1px); }
.side-nav a.on::before { content: ""; position: absolute; inset-inline-start: -.9rem; top: 9px; bottom: 9px; width: 4px; border-start-end-radius: 4px; border-end-end-radius: 4px; background: var(--orange); animation: grow-y .35s var(--ease); }
@keyframes grow-y { from { transform: scaleY(0); } }
.btn { transition: background .2s, border-color .2s, box-shadow .25s, transform .2s var(--ease), filter .2s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.icon-btn, .lang-btn, .chip, .seg button, .tab, .act { transition: background .2s, color .2s, border-color .2s, transform .2s var(--ease); }
.icon-btn:active, .chip:active, .act:active { transform: scale(.94); }
.badge-n { animation: badge-pop .5s var(--ease); }
@keyframes badge-pop { from { transform: scale(0); } 60% { transform: scale(1.25); } }

/* Cartes : légère élévation au survol */
.shortcut, .ocard, .niv-card, button.panel, button.impact-strip, button.objective, .qrow, .type-opt, .icon-tabs button, .mcard, .kpi, .tcard, .gcard, button.app-row { transition: transform .3s var(--ease), box-shadow .3s, border-color .2s, background .2s; }
.shortcut:hover, .ocard:hover, .niv-card:hover, button.panel:hover, button.impact-strip:hover, button.objective:hover, .qrow:hover { transform: translateY(-2px); box-shadow: var(--sh2); }
.type-opt:hover:not(.on) { border-color: color-mix(in srgb, var(--ink-2) 40%, var(--line-strong)); }
.niv-card.on:hover { box-shadow: inset 0 0 0 1.5px var(--sel-ring), var(--sh2); }
.shortcut:active, .ocard-main:active, button.panel:active, .qrow:active { transform: translateY(0) scale(.985); }
.shortcut .sc-ico { transition: transform .4s var(--ease); }
.shortcut:hover .sc-ico { transform: scale(1.08) rotate(-4deg); }
[dir="rtl"] .shortcut:hover .sc-ico { transform: scale(1.08) rotate(4deg); }

/* Entrées : les blocs d'une page arrivent l'un après l'autre */

@keyframes fade-in { from { opacity: 0; } }

.page > :nth-child(2) { animation-delay: .06s; } .page > :nth-child(3) { animation-delay: .12s; } .page > :nth-child(4) { animation-delay: .18s; }

:is(.offer-grid, .cards, .shortcuts, .kpis, .niv-grid, .board, .dir, .badges, .impact-facts, .app-list) > :nth-child(2) { animation-delay: .18s; }
:is(.offer-grid, .cards, .shortcuts, .kpis, .niv-grid, .board, .dir, .badges, .impact-facts, .app-list) > :nth-child(3) { animation-delay: .24s; }
:is(.offer-grid, .cards, .shortcuts, .kpis, .niv-grid, .board, .dir, .badges, .impact-facts, .app-list) > :nth-child(4) { animation-delay: .3s; }
:is(.offer-grid, .cards, .shortcuts, .kpis, .niv-grid, .board, .dir, .badges, .impact-facts, .app-list) > :nth-child(5) { animation-delay: .36s; }
:is(.offer-grid, .cards, .shortcuts, .kpis, .niv-grid, .board, .dir, .badges, .impact-facts, .app-list) > :nth-child(n+6) { animation-delay: .42s; }
.modal-back { animation: fade-in .2s ease backwards; }
.modal { animation: pop-in .3s var(--ease) backwards; }
.menu-pop, .more-pop { animation: pop-in .2s var(--ease) backwards; }
.bar-fill { transform-origin: left center; animation: grow-x 1.1s var(--ease) .25s backwards; }

@media (max-width: 760px) {

.annee-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; }
.annee-fact { display: flex; flex-direction: column; gap: .3rem; padding: .95rem; border-radius: var(--r-lg); border: 0; box-shadow: var(--sh1); background: var(--surface); animation: rise .55s var(--ease) backwards; }
.annee-fact:nth-child(2) { animation-delay: .05s; } .annee-fact:nth-child(3) { animation-delay: .1s; } .annee-fact:nth-child(4) { animation-delay: .15s; }
.annee-fact:nth-child(5) { animation-delay: .2s; } .annee-fact:nth-child(6) { animation-delay: .25s; } .annee-fact:nth-child(7) { animation-delay: .3s; } .annee-fact:nth-child(8) { animation-delay: .35s; }
.annee-fact .big { font-size: 1.9rem; }

/* Confidentialité, accord, application, désabonnement */
.privacy-wrap { padding: 4.2rem 16px 2rem; }
.priv-sec ul { margin: 0; padding-inline-start: 1.2rem; display: flex; flex-direction: column; gap: .35rem; color: var(--ink-2); }
.priv-sec p { color: var(--ink-2); }
.consent-back { z-index: 60; }
.desabo { max-width: 460px; margin: 4.5rem auto 2rem; display: flex; flex-direction: column; align-items: center; gap: .9rem; text-align: center; }
.push-row { display: flex; align-items: center; gap: .3rem .6rem; flex-wrap: wrap; }
.push-row > p { flex-basis: 100%; margin: 0; }
.ios-steps, .ouv-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; }
.ios-steps li, .ouv-points li { display: flex; align-items: center; gap: .7rem; }
.ios-steps .g-ico, .ouv-points .g-ico { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-md); background: var(--accent-soft); color: var(--blue-text); flex: none; }
/* Mon profil : ce que chacun reçoit sur le téléphone, par catégorie */
.md-titre { font-size: var(--fs-4); margin: .4rem 0 0; }
.md-cats { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: .55rem; }
.md-cats legend { padding: 0; margin-block-end: .45rem; font-weight: 600; font-size: var(--fs-3); }
.md-cats .check { align-items: flex-start; }
.md-cats .check input { margin-block-start: .2rem; flex: none; }
.md-cats .cat-txt { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.md-cats .cat-d { color: var(--muted); font-size: var(--fs-2); }
.md-cats > p { margin: 0; }
@media (max-width: 760px) {
  .bilan-kpis, .annee-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cafe-list, .sujets { grid-template-columns: minmax(0, 1fr); }
  .cafe { grid-template-columns: minmax(0, 1fr); }
  .cafe .slot-date { justify-self: start; }
  .map { height: 58vh; }
  .bilan-sheet { padding: 1.1rem; } .bilan-sheet::before { margin: -1.1rem -1.1rem .3rem; }
}
@media print {
  body.print-cert * { visibility: hidden !important; }
  body.print-cert .certificate, body.print-cert .certificate * { visibility: visible !important; }
  body.print-cert .certificate { position: fixed; inset: 0; margin: auto; height: max-content; box-shadow: none; padding: 0; }
  body.print-cert::before { display: none; }
  @page { size: A4 landscape; margin: 14mm; }
  body.print-bilan * { visibility: hidden !important; }
  body.print-bilan .bilan-sheet, body.print-bilan .bilan-sheet * { visibility: visible !important; }
  body.print-bilan .bilan-sheet { position: absolute; inset: 0 0 auto; margin: 0; border: 0; page: bilan; }
  body.print-bilan::before { display: none; }
  @page bilan { size: A4 portrait; margin: 16mm; }
}
/* ---------- Passe UX : échelles, feuilles, fêtes, mouvement ---------- */
:root { --warm: color-mix(in srgb, var(--brass) 9%, var(--surface)); }

/* Écran vide : une icône douce, une phrase, une action */
.empty { background: color-mix(in srgb, var(--surface) 55%, transparent); gap: .5rem; padding: 1.8rem 1.2rem; }
.panel .empty, .modal .empty { background: none; padding-block: 1.2rem; }
.empty > div { max-width: 46ch; }
.empty-ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--blue-text); margin-bottom: .25rem; }
.empty-act { margin-top: .5rem; }

/* Fenêtres : pied collé avec l'action principale ; feuille qui monte du bas sur téléphone */
.modal { display: flex; flex-direction: column; }
.modal-body { flex: 1 1 auto; }
.modal-foot { position: sticky; bottom: 0; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .8rem 1.15rem calc(.8rem + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); z-index: 1; }
.modal-foot .btn.primary { flex: 1; min-height: 46px; }
/* Le titre et le pied collés ne cachent jamais le champ où l'on écrit : le défilement (Tab, clavier) s'arrête avant eux */
.modal { scroll-padding-block: calc(var(--tete, 0px) + .5rem) calc(var(--pied, 0px) + .5rem); }
@media (min-width: 761px) { .modal-foot { justify-content: flex-end; } .modal-foot > .btn.primary { flex: 0 1 auto; min-width: 14rem; } }
.sheet-grip { display: none; }
@keyframes sheet-in { from { transform: translateY(100%); } }
@media (max-width: 760px) {
  .modal-back { place-items: end center; padding: 0; padding-top: env(safe-area-inset-top, 0px); }
  .modal, .modal.wide { width: 100%; max-height: 92vh; max-height: 92dvh; border-radius: var(--r-xl) var(--r-xl) 0 0; animation: sheet-in .34s var(--ease) backwards; }
  .modal-head { position: sticky; padding-top: 1.1rem; }
  .sheet-grip { display: block; position: absolute; top: 6px; inset-inline: 0; margin: 0 auto; width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); }
  .modal:not(.has-foot) .modal-body { padding-bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px)); }
  /* Clavier ouvert : la feuille se loge au-dessus, son pied (l'action principale) reste au pouce */
  .modal-back.clavier { inset: var(--vvt, 0px) 0 auto; height: var(--vvh, 100%); padding-top: 0; }
  .modal-back.clavier .modal { max-height: calc(var(--vvh, 100dvh) - 8px); }
  .modal-back.clavier .modal-foot { padding-bottom: .6rem; }
}

/* Cloche : une feuille, deux groupes. « À faire » porte le seul chiffre de la cloche ; « Nouvelles » n'a pas de chiffre */
.cl-groupe { display: flex; flex-direction: column; gap: .25rem; }
.cl-groupe + .cl-groupe { margin-top: .5rem; }
.cl-titre { display: flex; align-items: center; gap: .5rem; margin: 0; font-size: var(--fs-3); font-weight: 650; color: var(--ink); }
.cl-vide { display: flex; align-items: center; gap: .55rem; margin: 0; padding: .5rem 0; color: var(--ink-2); }
.cl-vide > .ico { flex: none; color: var(--good); }
.cl-vide > span { display: flex; flex-direction: column; gap: 2px; }
.af-liste, .nv-liste { list-style: none; margin: 0; padding: 0; }
.af-row { display: grid; grid-template-columns: 30px minmax(0, 1fr); grid-template-areas: "ico txt" ". bas"; align-items: start; gap: .4rem .7rem; padding: .75rem 0; }
.af-row + .af-row { border-top: 1px solid var(--line); }
.af-row > .n-ico { grid-area: ico; }
.af-txt { grid-area: txt; min-width: 0; color: var(--ink); overflow-wrap: anywhere; padding-top: .2rem; }
.af-bas { grid-area: bas; display: flex; align-items: center; justify-content: space-between; gap: .6rem; min-width: 0; }
.af-bas > .muted { white-space: nowrap; }
.af-go { background: var(--tonal-bg); border-color: transparent; color: var(--tonal-ink); }
.af-go:hover { background: var(--tonal-hover); border-color: transparent; }
.nv-liste .notif { padding-inline: 0; }
.a-faire { display: flex; flex-direction: column; gap: .5rem; }
.a-faire .af-liste { background: var(--surface); border: 0; box-shadow: var(--sh1); border-radius: var(--r-lg); padding: 0 1rem; }
.af-plus > summary { display: flex; align-items: center; gap: .45rem; min-height: 40px; padding: .4rem .15rem; cursor: pointer; list-style: none; font-weight: 600; font-size: var(--fs-2); color: var(--ink-2); }
.af-plus > summary::-webkit-details-marker { display: none; }
.af-plus[open] > summary { margin-bottom: .4rem; }
@media (min-width: 761px) {
  .modal-back:has(> .modal.cloche) { place-items: start end; padding: 64px 16px 16px; background: rgb(10 12 18 / .2); }
  .modal.cloche { width: min(420px, 100%); max-height: calc(100vh - 80px); }
}

/* Moments à fêter */
.fete-back { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 1rem; background: rgb(8 14 26 / .5); animation: fade-in .25s ease backwards; overflow: hidden; }
.fete { position: relative; z-index: 1; width: min(400px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; gap: .6rem; padding: 1.8rem 1.5rem 1.4rem; border-radius: var(--r-xl); background: var(--surface); box-shadow: 0 30px 80px -20px rgb(0 0 0 / .45); animation: fete-in .5s var(--ease) backwards; }
.fete::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--em-o) 20%, var(--surface)), color-mix(in srgb, var(--em-b) 10%, var(--surface)) 55%, var(--surface) 80%); z-index: -1; }
.fete h2 { font-size: var(--fs-5); }
.fete p { color: var(--ink-2); max-width: 32ch; }
.fete-ico { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--em-o); box-shadow: 0 8px 24px -8px rgb(243 146 0 / .55), inset 0 0 0 3px color-mix(in srgb, var(--em-o) 30%, transparent); animation: badge-pop .7s var(--ease) .15s backwards; }
.fete-acts { display: flex; flex-direction: column; gap: .4rem; width: 100%; margin-top: .5rem; }
.fete-acts .btn { width: 100%; min-height: 46px; }
@keyframes fete-in { from { opacity: 0; transform: translateY(24px) scale(.92); } }
.fete-pluie { position: absolute; inset: 0; pointer-events: none; }
.fete-pluie i { position: absolute; top: -16px; inset-inline-start: var(--x); width: 9px; height: 14px; border-radius: 2px; background: var(--c); opacity: 0; animation: tombe var(--d) cubic-bezier(.25, .6, .4, 1) var(--w) forwards; }
.fete-pluie i.rond { width: 9px; height: 9px; border-radius: 50%; }
@keyframes tombe { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), 70vh) rotate(var(--r)); } }

/* Rangs : les étudiants voient « a aidé N étudiants » au lieu d'un rang */
.aide-chip { display: inline-flex; align-items: center; gap: .2rem; background: var(--good-soft); color: var(--good); }

/* Bouton en attente : grisé, petit cercle */
.btn[aria-busy="true"] { pointer-events: none; opacity: .75; }
.btn[aria-busy="true"]::after { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-inline-end-color: transparent; animation: tourne .7s linear infinite; flex: none; }
@keyframes tourne { to { transform: rotate(360deg); } }

/* Navigation du bas : 5 onglets, libellés lisibles, cibles confortables */
@media (max-width: 760px) {
  .bottom-nav a { font-size: var(--fs-1); padding: .55rem 0 .5rem; min-height: 56px; }
  [dir="rtl"] .bottom-nav a { font-size: .8rem; }
  .btn.small { min-height: 38px; }
  .btn.tiny, .icon-btn.small, .linkish { position: relative; }
  .btn.tiny::before, .icon-btn.small::before, .linkish::before { content: ""; position: absolute; inset: -7px -4px; }
}
/* Au doigt : pas de zoom surprise sur iPhone quand on touche un champ (16 px au moins),
   boutons du haut à 44 px de haut (zone touchable un peu plus large que le dessin), filtres faciles à toucher */
@media (pointer: coarse) {
  input, select, textarea { font-size: 16px; }
  .top .icon-btn { height: 44px; }
  .top .icon-btn::before { content: ""; position: absolute; inset: 0 -3px; }
  .chip { min-height: 40px; }
}

/* Accueil : une prochaine étape, deux sections, des titres de section plus nets */
.home { gap: 1rem; }
.h-sec { color: var(--ink); margin: .6rem 0 0; }
.home-main > .h-sec, .home-side > .h-sec { margin-top: 0; }
.home-grid { margin-top: .6rem; gap: 1.6rem; }
.home-main .section-head h3, .home-side .section-head h3 { font-size: 1rem; }
.pas { display: flex; flex-direction: column; gap: .9rem; padding: 1.1rem 1.1rem 1rem; border-radius: var(--r-xl); background: var(--accent-soft); border: 0; color: var(--ink); }
.pas-txt { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.pas-oeil { display: flex; align-items: center; gap: .45rem; margin: 0; font-size: var(--fs-2); font-weight: 600; line-height: 1.3; color: var(--sel-ink); }
.pas-oeil > * { flex: none; }
.pas-oeil > span:last-child { flex: 0 1 auto; min-width: 0; }
.pas-titre { margin: 0; font-family: var(--f-display); font-size: 1.125rem; font-weight: 750; letter-spacing: -.012em; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pas-detail { margin: 0; font-size: .9375rem; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pas-act { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
.pas-go { width: 100%; min-height: 48px; font-size: 1rem; line-height: 1.25; white-space: normal; text-align: center; }
.pas-pied { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; column-gap: 1rem; margin-block-end: -.4rem; }
.pas-pied .linkish { display: inline-flex; align-items: center; gap: .45rem; min-height: 40px; font-size: .875rem; text-align: start; }
.pas-etapes { margin-inline-start: auto; color: var(--ink-2); font-weight: 500; }
.pas-anneau { --p: 0; flex: none; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1turn), color-mix(in srgb, var(--accent) 22%, transparent) 0); -webkit-mask: radial-gradient(circle, transparent 5px, #000 5.5px); mask: radial-gradient(circle, transparent 5px, #000 5.5px); }
.pas-anneau.grand { width: 32px; height: 32px; -webkit-mask: radial-gradient(circle, transparent 10px, #000 10.5px); mask: radial-gradient(circle, transparent 10px, #000 10.5px); }
[dir="rtl"] .pas-anneau { transform: scaleX(-1); }
@media (max-width: 760px) { .pas-pied:has(> :nth-child(2)) { flex-direction: column; align-items: flex-start; } .pas-pied:has(> :nth-child(2)) .pas-etapes { margin-inline-start: 0; } }
@media (min-width: 761px) { .pas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(14rem, 18rem); align-items: center; column-gap: 1.75rem; padding: 1.2rem 1.4rem; } .pas-go { min-height: 44px; } .pas-pied { justify-content: center; } .pas-etapes { margin-inline-start: 0; } }
/* Premiers pas, en feuille */
.etapes-tete { display: flex; align-items: center; gap: .8rem; margin-block-end: .5rem; }
.etapes-tete p { margin: 0; display: flex; flex-direction: column; }
.etapes { list-style: none; margin: 0; padding: 0; }
.etapes li { display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: .75rem; row-gap: .15rem; padding-block: .85rem; border-block-start: 1px solid var(--line); }
.etapes li:first-child { border-block-start: 0; }
.etapes .e-ico { grid-row: span 3; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--blue-text); }
.etapes li.fait .e-ico { background: var(--good); color: var(--surface); }
.etapes li.fait strong { color: var(--ink-2); }
.etapes li.plus-tard .e-ico { background: var(--surface-2); color: var(--muted); }
.etapes li > .btn { grid-column: 2; justify-self: start; margin-block-start: .35rem; min-height: 40px; }
.etapes-ensuite { margin: 1rem 0 0; font-size: var(--fs-2); font-weight: 600; color: var(--muted); }
/* Accueil : un seul bouton plein, celui de la carte « prochaine étape » ; ailleurs sur l'accueil, des boutons tonals */
.home :is(.home-grid, .photo-trouvee) .btn.primary:not(.modal .btn) { background: var(--tonal-bg); border-color: transparent; color: var(--tonal-ink); box-shadow: none; }
.home :is(.home-grid, .photo-trouvee) .btn.primary:not(.modal .btn):hover { background: var(--tonal-hover); }
/* « Cette semaine » : la vie du réseau, puis trois petites choses au plus */
.semaine > .bloc-corps { gap: .5rem; }
.semaine .todo { background: var(--surface); border: 0; box-shadow: var(--sh1); border-radius: var(--r-lg); padding: .2rem .25rem; }
.semaine .todo li + li { border-block-start: 1px solid var(--line); }
.semaine .notif { min-height: 52px; align-items: center; gap: .65rem; padding: .5rem .55rem; }
.semaine .notif > span:nth-child(2) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
.semaine .n-ico { width: 28px; height: 28px; }
.merci-une .merci { background: none; }
/* Accueil en trois blocs : un bloc sans contenu disparaît avec son titre (réseau encore petit, début de saison) */
.bloc, .bloc-corps { display: flex; flex-direction: column; gap: .8rem; min-width: 0; }
.bloc:has(> .bloc-corps:empty) { display: none; }
.en-plus { display: contents; }
.plus-reseau { display: none; }
@media (max-width: 760px) {
  .plus-reseau { display: inline-flex; align-self: center; }
  .en-plus { display: none; }
  .plus.ouvert .en-plus { display: flex; }
}
.home-side .panel.star .small { color: var(--ink-2); }

/* Annonce de l'école : une ligne sur l'accueil, pour son seul public ; un appui la déplie */
.annonce { align-items: flex-start; }
.annonce > svg { color: var(--blue-text); margin-top: .15rem; }
.annonce-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .2rem; }
.annonce-ligne { display: flex; align-items: center; gap: .5rem; min-height: 44px; padding-inline: .85rem .25rem; border-radius: var(--r-lg); background: color-mix(in srgb, var(--surface) 60%, transparent); box-shadow: inset 0 0 0 1px var(--hair); color: var(--ink-2); }
.annonce-ligne > svg { flex: none; color: var(--blue-text); }
.annonce-txt { flex: 1; min-width: 0; padding-block: .6rem; border: 0; background: none; color: inherit; font: inherit; font-size: .875rem; line-height: 1.4; text-align: start; cursor: pointer; }
.annonce-txt > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.annonce-ligne.ouverte { flex-wrap: wrap; align-items: flex-start; }
.annonce-ligne.ouverte > svg { margin-block-start: .75rem; }
.annonce-ligne.ouverte .annonce-txt > span { white-space: normal; overflow-wrap: anywhere; }
.annonce-lien { flex-basis: 100%; padding-block-end: .6rem; padding-inline-start: 1.5rem; font-size: .875rem; font-weight: 600; }

/* En-tête de l'accueil : plus bas sur téléphone, texte lisible sur l'illustration sur ordinateur */
.home-hero .hello-txt::before { content: ""; position: absolute; inset: -1.7rem -2rem -1.7rem -1.9rem; z-index: -1; background: linear-gradient(90deg, color-mix(in srgb, var(--sky-2) 88%, transparent) 55%, transparent); pointer-events: none; }
[dir="rtl"] .home-hero .hello-txt::before { background: linear-gradient(270deg, color-mix(in srgb, var(--sky-2) 88%, transparent) 55%, transparent); }
/* Téléphone : « Bonsoir Salma », une ligne, puis une bande de l'entrée ; la carte « prochaine étape » tient sans défiler */
@media (max-width: 760px) {
  .home-hero { min-height: 0; padding: .85rem 1rem 0; border-radius: 18px; }
  .home-hero .hello-txt { max-width: none; gap: .1rem; }
  .home-hero .hello-txt::before, .home-hero .hello-sub { display: none; }
  .home-hero h1 { font-size: 1.5rem; line-height: 1.2; }
  .home-hero .scene { --band: 72px; position: relative; inset: auto; height: var(--band); margin: .6rem -1rem 0; }
  /* dessin 800×400 montré de y=24 (sommet de la porte) à y=340 (premières fleurs), porte au centre */
  .home-hero .scene svg { inset-block: calc(var(--band) * -24 / 316) auto; inset-inline: 0; margin-inline: auto; width: calc(var(--band) * 800 / 316); height: calc(var(--band) * 400 / 316); }
}

/* Mouvement : les blocs n'arrivent en cascade qu'au premier affichage ; ensuite, un simple fondu */
.shell:not(.premier) .page > :not(.modal-back) { animation: fade-in .22s ease backwards; animation-delay: 0s; }
.shell:not(.premier) :is(.offer-grid, .cards, .shortcuts, .kpis, .niv-grid, .board, .dir, .badges, .impact-facts, .app-list) > * { animation: none; }
::view-transition-old(root) { animation: .14s ease both fade-out; }
::view-transition-new(root) { animation: .2s var(--ease) both vt-in; }
@keyframes fade-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; transform: translateY(6px); } }

/* ===== Lot design · B : onglets sur une ligne, listes régulières et courtes, filtres en feuille ===== */
/* Repli tant que la partie A n'est pas fusionnée : l'action d'une ligne ou d'une carte répétée (la règle .btn.tonal de A l'emporte ensuite) */
:where(.btn).tonal { background: var(--tonal-bg); color: var(--tonal-ink); border-color: transparent; }
:where(.btn).tonal:hover { background: var(--tonal-hover); border-color: transparent; }

/* Onglets du Réseau et de l'Admin : une rangée fine de puces qui défile, la puce active toujours visible (ramenée au centre) */
.puces-nav { display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; padding-block: 2px; }
.puces-nav::-webkit-scrollbar { display: none; }
.puces-nav [role="tab"] { flex: none; position: relative; display: inline-flex; align-items: center; gap: .4rem; height: 36px; padding-inline: .8rem .9rem; border-radius: var(--r-pill); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font: 500 .875rem/1 var(--f-body); white-space: nowrap; cursor: pointer; transition: background .15s, color .15s, box-shadow .15s, border-color .15s; }
.puces-nav [role="tab"] svg { flex: none; color: var(--muted); }
.puces-nav [role="tab"]:hover:not(.on) { background: var(--surface-2); color: var(--ink); }
.puces-nav [role="tab"].on { background: var(--sel-bg); color: var(--sel-ink); border-color: transparent; box-shadow: inset 0 0 0 1px var(--sel-ring); font-weight: 600; }
.puces-nav [role="tab"].on svg { color: currentColor; }
.puces-nav .puce-n { min-width: 1.25rem; height: 1.25rem; padding-inline: .32rem; margin-inline-end: -.3rem; border-radius: var(--r-pill); background: var(--brass); color: #fff; font: 700 var(--fs-1)/1.25rem var(--f-body); font-variant-numeric: tabular-nums; text-align: center; }
@media (max-width: 760px) { .puces-nav { margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; } }

/* Un seul modèle de ligne : visage 40 px | nom (600) et une ou deux lignes de méta (13 px) | une action à droite.
   Les lignes sont groupées sur une carte, séparées par un filet. */
.lignes { list-style: none; margin: 0; padding: 0 var(--sp-4); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh1); min-width: 0; }
.ligne { display: flex; align-items: center; gap: var(--sp-3); min-height: 64px; padding-block: var(--sp-3); border-top: 1px solid var(--line); min-width: 0; }
.ligne:first-child { border-top: 0; }
.ligne > .person, .ligne > .ligne-main { flex: 1 1 auto; min-width: 0; gap: var(--sp-3); }
.ligne-main { display: flex; align-items: center; border: 0; background: none; padding: 0; color: inherit; text-align: start; cursor: pointer; font: inherit; }
.ligne-main:hover .ligne-nom, .ligne .person:hover .person-name { color: var(--accent); }
.ligne .person-txt, .ligne-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; line-height: 1.3; }
.ligne .person-name, .ligne-nom { font-weight: 600; font-size: var(--fs-3); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ligne .role-line, .ligne-meta { font-size: var(--fs-2); color: var(--muted); min-width: 0; }
/* Chaque ligne de texte tient sur une ligne (points de suspension) : toutes les lignes ont la même hauteur, le détail est dans la fiche */
.ligne-meta { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne-act { flex: none; display: flex; align-items: center; gap: var(--sp-2); margin-inline-start: auto; }
.ligne-act .icon-btn { width: 40px; height: 40px; }
.ligne-chiffre { flex: none; margin-inline-start: auto; font: 750 var(--fs-4)/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.ligne-chiffre small { font: 500 var(--fs-2) var(--f-body); color: var(--muted); margin-inline-start: .2rem; }
/* Classement : lignes de 56 px, rang (médaille pour les trois premiers), visage, nom et faits, points à droite */
.ligne.rang { min-height: 56px; padding-block: var(--sp-2); }
.ligne.rang.me { box-shadow: inset 3px 0 0 var(--accent); margin-inline: calc(var(--sp-4) * -1); padding-inline: var(--sp-4); }
.rang-n { flex: none; width: 28px; text-align: center; font: 650 var(--fs-3)/1 var(--f-body); font-variant-numeric: tabular-nums; color: var(--muted); }
.rang-faits { flex: none; display: inline-flex; gap: .55rem; flex-wrap: nowrap; }
.rang-faits span { display: inline-flex; align-items: center; gap: .25rem; }
/* Au-dessus d'une liste : combien il y en a, en tout */
.liste-tete { display: flex; align-items: center; gap: var(--sp-2); min-height: 20px; margin: 0; font-size: var(--fs-2); color: var(--muted); }
.liste-tete b { font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.voir-plus { align-self: center; min-width: min(100%, 16rem); color: var(--tonal-ink); }

/* Recherche et un bouton « Filtres » sur une seule ligne ; les listes déroulantes vivent dans une feuille du bas */
.recherche-filtres { display: flex; gap: var(--sp-2); align-items: stretch; min-width: 0; }
.recherche-filtres .search { flex: 1 1 auto; min-width: 0; }
.filtres-btn { flex: none; min-height: 44px; padding-inline: .85rem; }
.filtres-btn.on { background: var(--sel-bg); color: var(--sel-ink); border-color: transparent; box-shadow: inset 0 0 0 1px var(--sel-ring); }
.filtres-feuille .filtres-corps { display: flex; flex-direction: column; gap: var(--sp-4); }
.filtres-corps .field { margin: 0; }
.filtres-corps select { width: 100%; max-width: none; }
.filtres-bascules { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.filtres-bascules .chip { min-height: 36px; }
.filtres-bascules .chip.on { background: var(--sel-bg); color: var(--sel-ink); border-color: transparent; box-shadow: inset 0 0 0 1px var(--sel-ring); font-weight: 600; }
.filtres-feuille .modal-foot .btn.ghost { flex: none; }

/* Suivi : quatre chiffres en tête (les .kpis), le détail replié dessous */
.suivi-detail > summary { display: flex; align-items: center; justify-content: center; gap: .4rem; min-height: 44px; padding: .5rem 1rem; border-radius: var(--r-md); color: var(--tonal-ink); background: var(--tonal-bg); font-weight: 600; cursor: pointer; list-style: none; width: max-content; max-width: 100%; margin-inline: auto; }
.suivi-detail > summary::-webkit-details-marker { display: none; }
/* (plus précis que le miroir arabe des flèches : vers le bas, puis vers le haut, dans les deux sens d'écriture) */
.suivi-detail > summary svg.ico-arrow { transition: transform .2s; transform: rotate(90deg); }
.suivi-detail[open] > summary svg.ico-arrow { transform: rotate(-90deg); }
.suivi-detail[open] > summary { margin-bottom: var(--sp-5); }
.suivi-detail-corps { display: flex; flex-direction: column; gap: var(--sp-5); }

/* Chiffres d'en-tête (Admin, Mon année…) : sans majuscules d'étiquette, gros chiffres en police des titres, cartes sans bordure */
.kpi .kpi-val { font-family: var(--f-display); font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.niv-num .big { font-family: var(--f-display); font-weight: 750; font-variant-numeric: tabular-nums; }
.rank .num { font-weight: 600; font-variant-numeric: tabular-nums; }
/* Détails des lignes : deux lignes de méta passées en « sub », le logo d'entreprise à droite, l'état d'un talent */
.ligne .role-line { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-block: 3px; margin-block: -3px; }
.ligne .role-line > * { vertical-align: middle; }
/* En arabe, un nom écrit en lettres latines reste calé à droite comme le reste de la ligne */
:root[dir="rtl"] .ligne .person-name { text-align: right; }
.ligne .role-line > .verif, .ligne .role-line > .mini { margin-inline-start: .25rem; }
.ligne-sub { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Une seule ligne sous le nom, pour garder 56 px : la promo, puis les faits quand la place le permet
   (sur téléphone, la promo seule ; le détail des points est dans la fiche) */
.ligne.rang .role-line { display: flex; flex-wrap: nowrap; align-items: center; gap: .6rem; white-space: nowrap; overflow: hidden; }
.rang-promo { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 480px) { .ligne.rang .rang-faits { display: none; } }
.ligne-logo { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: var(--r-md); background: none; cursor: pointer; padding: 0; }
.ligne-logo:hover { background: var(--surface-2); }
.ligne .ligne-etat { background: none; padding: 0; font-weight: 600; }
.ligne .ligne-meta strong { font-weight: 600; color: var(--ink-2); }
.fiche-talent { display: flex; flex-direction: column; gap: var(--sp-3); }
.fiche-talent p { margin: 0; }
/* Une rangée de puces qui défile au lieu de s'empiler (catégories de l'Entraide) */
.chips.rangee { flex-wrap: nowrap; align-items: center; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; padding-block: 3px; }
.chips.rangee::-webkit-scrollbar { display: none; }
.chips.rangee .chip { flex: none; white-space: nowrap; min-height: 36px; }
.chips.rangee .chip.on { background: var(--sel-bg); color: var(--sel-ink); border-color: transparent; box-shadow: inset 0 0 0 1px var(--sel-ring); font-weight: 600; }
@media (max-width: 760px) { .chips.rangee { margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; } }
/* (fin de la partie B) */

/* ===== Lot design · C : visages, logos, icônes, badges, bouclier « vérifié » ===== */
/* Tuile des vrais logos : blanche, jour et nuit, avec un filet */
:root { --tuile-logo: #FFFFFF; --tuile-filet: rgb(19 33 58 / .12); }
/* Visages et monogrammes de nuit : fond sombre désaturé, lettres claires de la même teinte */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :is(.avatar, .clogo:not(.c-img)) { background: hsl(var(--h, 205) calc(var(--s, 50%) * .45) 25%); color: hsl(var(--h, 205) 60% 85%); } }
:root[data-theme="dark"] :is(.avatar, .clogo:not(.c-img)) { background: hsl(var(--h, 205) calc(var(--s, 50%) * .45) 25%); color: hsl(var(--h, 205) 60% 85%); }
/* Piles : trois visages au plus puis « +N », 6 px de recouvrement, anneau de la couleur du fond */
.av-pile { display: inline-flex; align-items: center; flex: none; }
.av-pile > * { box-shadow: 0 0 0 2px var(--surface); }
.av-pile > * + * { margin-inline-start: -6px; }
/* Dans les piles des autres écrans (.av-stack), le voisin couvre le bord : une seule lettre */
.av-stack .avatar .av-l2 { display: none; }
.av-plus { display: inline-grid; place-items: center; padding-inline: 5px; border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-2); font-weight: 600; line-height: 1; }
/* Icônes : le même trait partout, 1,75 px à l'écran quelle que soit la taille */
svg.ico { stroke-width: 1.75px; }
svg.ico :is(path, circle, rect, line, polyline, polygon, ellipse) { vector-effect: non-scaling-stroke; }
/* Bouclier « vérifié » juste après le nom ; sur la fiche, son explication */
.person-l1 { display: flex; align-items: center; gap: var(--sp-1); min-width: 0; }
.verif-boite { display: inline-flex; }
.verif-btn { border: 0; background: none; padding: 6px; margin-block: -6px; margin-inline: -8px -6px; border-radius: var(--r-pill); cursor: pointer; color: var(--teal); display: inline-flex; }
.verif-btn[aria-expanded="true"] { background: color-mix(in srgb, var(--teal) 14%, transparent); }
.verif-pop { position: absolute; z-index: 6; inset-block-start: calc(100% + 6px); inset-inline-start: 0; width: max-content; max-width: min(20rem, 100%); display: flex; flex-direction: column; gap: 2px; padding: var(--sp-3); border-radius: var(--r-md); background: var(--raised); box-shadow: var(--sh3); color: var(--ink-2); font: 400 var(--fs-2)/1.45 var(--f-body); text-align: start; }
.verif-pop[hidden] { display: none; }
.verif-pop strong { color: var(--ink); font-weight: 600; }
.profile-l1 { position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); }
.od-author-line .verif { margin-inline-start: 4px; vertical-align: -3px; }
/* La phrase sous les listes où paraissent de vrais logos */
.mention-logos { margin: var(--sp-2) 0 0; color: var(--muted); font-size: var(--fs-2); text-align: center; text-wrap: balance; }
/* (fin de la partie C) */

/* ===== Lot design · D : ordinateur, vraie mise en page ===== */
/* Coque sur ordinateur : la barre latérale couvre toute la hauteur, son contenu reste en vue (collé en haut).
   1280 px et plus : la barre entière ; de 761 à 1279 px : un rail (icône et mot court, comme la barre du bas).
   Téléphone (760 px et moins) : rien ne change de place. */
@media (min-width: 761px) {
  .shell { --side-w: 84px; grid-template-columns: var(--side-w) minmax(0, 1fr); }
  .side { position: relative; top: auto; height: auto; display: block; padding: 0; background: var(--surface); border-inline-end: 1px solid var(--line); }
  .side-in { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: var(--sp-3); padding: 0 var(--sp-2) var(--sp-4); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .side-in::-webkit-scrollbar { display: none; }
  .side .brand { flex: none; display: flex; align-items: center; gap: .65rem; min-height: 60px; border-radius: var(--r-md); }
  .top { min-height: 60px; }
  /* Publier : tonal, comme « Nouveau message » des messageries, pour laisser le seul bouton plein à l'écran ouvert */
  .btn.side-pub { flex: none; background: var(--tonal-bg); border-color: transparent; color: var(--tonal-ink); box-shadow: var(--sh1); font-weight: 650; }
  .btn.side-pub:hover { background: var(--tonal-hover); border-color: transparent; box-shadow: var(--sh2); transform: none; }
  /* Navigation : plus de tuile grise autour des icônes (20 px), plus de barre orange ; un seul aspect « sélectionné » */
  .nav-ico { width: auto; height: auto; border-radius: 0; background: none; color: inherit; }
  .side-nav a.on .nav-ico { background: none; color: inherit; }
  .side-nav a.on::before { content: none; }
  .side-nav a:hover .nav-ico { transform: none; }
  .side-nav .nav-n { font-size: var(--fs-1); }
  /* Le bouton « Publier » de la barre latérale suffit : le même bouton dans la page se cache (offre du lauréat, événement de l'admin) */
  .shell[data-publier="offre"] .page-head .publier-offre, .shell[data-publier="evenement"] :is(#ev-new, #adm-ev-new) { display: none; }
  /* Largeurs : des marges régulières, une seule largeur de page */
  .content { padding-block: var(--sp-5) var(--sp-7); padding-inline: var(--sp-5); }
  .page { max-width: 1040px; }
}
@media (min-width: 761px) and (max-width: 1279px) {
  .side-in { align-items: center; }
  .side .brand { justify-content: center; width: 100%; }
  .side .brand-txt, .side .side-lib { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .btn.side-pub { flex-direction: column; gap: 2px; width: 64px; min-height: 56px; padding: .45rem .2rem; border-radius: var(--r-lg); font-size: var(--fs-1); line-height: 1.2; }
  .side-nav { display: flex; flex-direction: column; gap: var(--sp-1); width: 100%; }
  .side-nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 0; padding: .25rem 0 .35rem; border-radius: var(--r-md); background: none; color: var(--ink-2); font-size: var(--fs-1); font-weight: 500; line-height: 1.2; text-align: center; }
  .side-nav a .nav-ico { display: grid; place-items: center; width: 56px; height: 32px; border-radius: var(--r-pill); transition: background .2s, color .2s; }
  .side-nav a:hover { background: none; color: var(--ink); }
  .side-nav a:hover .nav-ico { background: var(--surface-2); }
  .side-nav a.on, .side-nav a[aria-current="page"] { background: none; box-shadow: none; color: var(--sel-ink); font-weight: 600; }
  .side-nav a.on .nav-ico, .side-nav a[aria-current="page"] .nav-ico { background: var(--sel-bg); color: var(--sel-ink); box-shadow: inset 0 0 0 1px var(--sel-ring); }
  .side-court { display: block; max-width: 100%; overflow-wrap: anywhere; }
  .side-nav .nav-n { position: absolute; top: 0; inset-inline-start: calc(50% + 8px); margin: 0; min-width: 18px; height: 18px; padding: 0 5px; line-height: 18px; }
  .side-nav .dotn { position: absolute; top: 4px; inset-inline-start: calc(50% + 15px); margin: 0; }
  .side-foot { display: none; }
}
@media (min-width: 1280px) {
  .shell { --side-w: clamp(258px, 18.5vw, 276px); } /* 258 px : « Meknès · Lauréats & étudiants » tient sur une ligne */
  .side-in { gap: var(--sp-4); padding-inline: var(--sp-3); }
  .side .brand { padding-inline: var(--sp-2); }
  .side .brand-txt { min-width: 0; }
  .side .brand-txt strong { font-size: var(--fs-4); font-weight: 750; letter-spacing: -.01em; }
  .side .brand-txt span { font-size: var(--fs-1); line-height: 1.35; }
  .side-court { display: none; }
  .btn.side-pub { width: 100%; min-height: 44px; padding: .6rem .75rem; gap: .5rem; border-radius: var(--r-md); white-space: normal; line-height: 1.25; text-align: center; }
  .side-nav { display: flex; flex-direction: column; gap: 2px; }
  .side-nav a { display: flex; align-items: center; gap: .75rem; min-height: 44px; padding: .5rem .75rem; border-radius: var(--r-md); color: var(--ink-2); font-weight: 500; }
  .side-nav a:hover { background: var(--surface-2); color: var(--ink); }
  .side-nav a.on, .side-nav a[aria-current="page"] { background: var(--sel-bg); color: var(--sel-ink); box-shadow: inset 0 0 0 1px var(--sel-ring); font-weight: 600; }
  .side-nav .side-lib { flex: 1; min-width: 0; }
  /* Pastilles alignées : le point et le compteur ont le même centre */
  .side-nav .nav-n { flex: none; margin-inline-start: 0; }
  .side-nav .dotn { flex: none; margin-inline: 0 6px; }
  .side-foot { margin-top: auto; padding-inline: .75rem; }
}
/* Téléphone : la barre du bas prend l'aspect « sélectionné » commun */
@media (max-width: 760px) {
  .bottom-nav a.on, .bottom-nav a[aria-current="page"] { color: var(--sel-ink); font-weight: 600; }
  .bottom-nav a.on .bn-ico, .bottom-nav a[aria-current="page"] .bn-ico { background: var(--sel-bg); color: var(--sel-ink); box-shadow: inset 0 0 0 1px var(--sel-ring); }
}

/* Accueil. Téléphone et tablette : une seule colonne, dans l'ordre d'avant (les enveloppes s'effacent).
   Ordinateur (1080 px et plus) : une colonne principale (environ 640 à 680 px) et, à droite, une colonne fixe de 340 px,
   présente dès le haut et collante (sous la barre du haut si elle tient dans l'écran, sinon par le bas). */
.home-cols, .home-col { display: contents; }
.page.home > .home-cols { animation: none; }
.home-col > :not(.modal-back) { animation: rise .6s var(--ease) backwards; }
.home-col > :nth-child(2) { animation-delay: .06s; } .home-col > :nth-child(3) { animation-delay: .12s; }
.home-col > :nth-child(4) { animation-delay: .18s; } .home-col > :nth-child(n+5) { animation-delay: .24s; }
.home-cols > .home-grid { animation: none; }
.home-grid > :is(.home-main, .home-side, .home-plus) { animation: rise .6s var(--ease) .3s backwards; }
.shell:not(.premier) :is(.home-col > *, .home-grid > .home-main, .home-grid > .home-side, .home-grid > .home-plus) { animation: fade-in .22s ease backwards; animation-delay: 0s; }
@media (max-width: 1079px) { .home-grid { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 761px) and (max-width: 1079px) { .page.home { max-width: 720px; } }
@media (min-width: 1080px) {
  .home-cols { display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 26vw, 340px); grid-template-rows: auto auto 1fr; column-gap: var(--sp-5); row-gap: var(--sp-6); align-items: start; }
  .home-col { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
  .home-cols > .home-grid { display: contents; }
  .home-main { grid-column: 1; grid-row: 2; }
  /* « Lauréat du mois » et « L'école en ce moment » (lauréats, admin) : sous « Pour toi », pour que les colonnes finissent ensemble */
  .home-plus { grid-column: 1; grid-row: 3; display: flex; flex-direction: column; gap: .8rem; min-width: 0; }
  .home-plus .panel.star .small { color: var(--ink-2); }
  .home-side { grid-column: 2; grid-row: 1 / span 3; position: sticky; top: min(calc(var(--haut-h, 60px) + 16px), calc(100vh - var(--cote-h, 0px) - 24px)); }
  /* La carte « prochaine étape » dans la colonne principale : le texte garde la place */
  .home-col .pas { grid-template-columns: minmax(0, 1fr) minmax(12rem, 15rem); column-gap: 1.25rem; }
  /* Colonne de droite (340 px) : chaque bloc se lit de haut en bas, sans mot coupé ligne par ligne */
  .home-side .wins-panel { margin-top: 0; }
  .home-side .win { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; column-gap: .75rem; row-gap: .4rem; }
  .home-side .win > .avatar { grid-row: span 2; }
  .home-side .win-act { grid-column: 2; justify-self: start; margin-inline-start: -.35rem; }
  .home-side .cafe { grid-template-columns: minmax(0, 1fr); row-gap: .55rem; }
  .home-side .cafe .slot-date { justify-self: start; display: inline-flex; align-items: baseline; flex-wrap: wrap; gap: 0 .45rem; min-width: 0; }
  .home-side .cafe .slot-date .sd-time { font-size: var(--fs-3); }
  .home-side .cafe-who { flex-wrap: wrap; row-gap: .3rem; }
  .home-side .merci-une .merci { background: none; padding-block: .1rem; }
}
/* En-tête de l'accueil sur ordinateur : la porte de l'école s'écarte du texte, le voile derrière le texte est plus franc */
@media (min-width: 761px) {
  .home-hero { min-height: 224px; }
  .home-hero .scene { inset-inline-end: -6%; }
  .home-hero h1 { font-size: 2.25rem; line-height: 1.15; }
  .home-hero .hello-txt { max-width: min(58%, 22rem); }
  .home-hero .hello-txt::before { inset: -1.7rem -4.5rem -1.7rem -1.9rem; background: linear-gradient(90deg, color-mix(in srgb, var(--sky-2) 95%, transparent) 72%, transparent); }
  [dir="rtl"] .home-hero .hello-txt::before { inset: -1.7rem -1.9rem -1.7rem -4.5rem; background: linear-gradient(270deg, color-mix(in srgb, var(--sky-2) 95%, transparent) 72%, transparent); }
}
/* (fin de la partie D) */

/* ===== Lot mouvement · B : feuilles au doigt, toucher natif, onglets qui glissent, messages du bas ===== */
:root { --good-on-ink: #5DC991; --action-on-ink: #9AD2F5; --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-in: cubic-bezier(.4, 0, 1, 1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --good-on-ink: #1D7348; --action-on-ink: #135F8F; } }
:root[data-theme="dark"] { --good-on-ink: #1D7348; --action-on-ink: #135F8F; }

/* Toucher : pas de flash bleu ; ce qu'on touche s'enfonce aussitôt, puis revient en douceur */
html { -webkit-tap-highlight-color: transparent; }
.seg button, .tab, .puces-nav [role="tab"], button.person, .notif, .menu-pop button, .more-pop button, .bottom-nav a .bn-ico, .lang-btn, .me-btn, .type-opt, .niv-card, button.impact-strip, button.objective, button.app-row, .tcard, .gcard, .mcard, .dm-card .btn, .toast-annuler { transition-property: background, color, border-color, box-shadow, transform, opacity; transition-duration: .22s; transition-timing-function: var(--ease); }
.seg button:active:not(:disabled), .tab:active, .puces-nav [role="tab"]:active, .lang-btn:active, .me-btn:active, .toast-annuler:active { transform: scale(.95); transition-duration: .08s; }
button.person:active, .notif:active, button.app-row:active, .type-opt:active, .niv-card:active, button.impact-strip:active, button.objective:active, button.tcard:active, button.gcard:active, button.mcard:active { transform: scale(.985); transition-duration: .08s; }
.btn:active:not(:disabled), .icon-btn:active, .chip:active, .act:active, .shortcut:active, .ocard-main:active, button.panel:active, .qrow:active { transition-duration: .08s; }
.bottom-nav a:active .bn-ico { transform: scale(.88); transition-duration: .08s; }
.menu-pop button:active, .more-pop button:active { background: var(--surface-2); transition-duration: .05s; }
@media (hover: none) {
  .btn, .seg button, .tab, .puces-nav [role="tab"], .bottom-nav a, .side-nav a, .chip, .icon-btn, .menu-pop button, .toast-annuler { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
}

/* La page derrière une feuille ne défile plus ; la barre de défilement garde sa place (rien ne saute à droite) */
html.defil-bloque { overflow: hidden; overscroll-behavior: none; }
html.defil-bloque.defil-gouttiere { scrollbar-gutter: stable; }
.modal, .fete { overscroll-behavior: contain; }

/* Le voile s'éclaircit à mesure qu'on descend la feuille, puis s'efface avec elle */
@property --voile { syntax: "<number>"; inherits: true; initial-value: 1; }
.modal-back { background: rgb(10 12 18 / calc(.45 * var(--voile, 1))); }
.fete-back { background: rgb(8 14 26 / calc(.5 * var(--voile, 1))); }
@media (min-width: 761px) { .modal-back:has(> .modal.cloche) { background: rgb(10 12 18 / calc(.2 * var(--voile, 1))); } }
/* À l'ouverture, seul le voile se fond : la feuille, elle, monte d'un bloc (sans devenir transparente) */
@keyframes voile-in { from { --voile: 0; } }
.modal-back, .fete-back { animation: voile-in .3s ease backwards; }
/* Tirée vers le haut (ou en ressort), la feuille ne découvre jamais le bas de l'écran */
.modal.glisse, .fete.glisse { box-shadow: 0 90px 0 0 var(--surface), var(--sh3); }

/* Sortie : la copie inerte de la feuille repart (vers le bas sur téléphone, en fondu sur ordinateur) */
@keyframes voile-out { to { --voile: 0; } }
@keyframes pop-out { to { opacity: 0; transform: translateY(8px) scale(.97); } }
@keyframes sheet-out { to { transform: translate3d(0, 100%, 0); } }
.modal-back.sortie, .fete-back.sortie { pointer-events: none; animation: voile-out var(--sortie-d, .24s) ease forwards; }
.modal-back.sortie > .modal, .fete-back.sortie > .fete { animation: pop-out .18s var(--ease-in) forwards; }
.fete-back.sortie > .fete-pluie { display: none; }

@media (max-width: 760px) {
  .modal, .modal.wide { animation: sheet-in .42s var(--ease-out) backwards; }
  .modal-head { touch-action: none; }
  .modal-back.sortie > .modal, .fete-back.sortie > .fete { animation: sheet-out var(--sortie-d, .28s) var(--sortie-e, cubic-bezier(.32, 0, .67, 0)) forwards; }
  /* Sur téléphone, les fêtes aussi montent du bas */
  .fete-back { place-items: end center; padding: 0; padding-top: env(safe-area-inset-top, 0px); }
  .fete { width: 100%; max-height: 92vh; max-height: 92dvh; overflow: auto; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 2rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom, 0px)); animation: sheet-in .5s var(--ease-out) backwards; }
  .fete > .sheet-grip { touch-action: none; }
  .fete > .sheet-grip::after { content: ""; position: absolute; inset: -12px -64px; }
}

/* Onglets : la pastille (ou le trait) glisse de l'ancien onglet au nouveau ; elle n'existe que le temps du geste */
.tabs, .seg, .puces-nav { position: relative; isolation: isolate; }
.trait-vol::after { content: ""; position: absolute; left: 0; top: 0; width: var(--tw); height: var(--th); transform: translate(var(--tx), var(--ty)); transition: transform .36s var(--ease-out), width .36s var(--ease-out), height .36s var(--ease-out); pointer-events: none; }
.trait-pose::after { transition: none !important; }
.tabs.trait-vol::after { border-radius: 2px; background: var(--accent); z-index: 1; }
.tabs.trait-vol > .tab.on { border-bottom-color: transparent; }
.seg.trait-vol::after { z-index: -1; border-radius: 9px; background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--sel-ring); }
.seg.trait-vol > .on { background: transparent !important; box-shadow: none !important; }
.puces-nav.trait-vol::after { z-index: 1; border-radius: var(--r-pill); background: var(--sel-bg); box-shadow: inset 0 0 0 1px var(--sel-ring); }
.puces-nav.trait-vol > * { transform: none !important; }
.puces-nav.trait-vol > * > * { position: relative; z-index: 2; }
.puces-nav.trait-vol > .on { background: var(--surface); border-color: var(--line-strong); box-shadow: none; }

/* Messages du bas : une icône par sorte, ils montent en fondu et repartent de même ; « Annuler » quand on peut revenir en arrière */
@keyframes toast-in { from { opacity: 0; transform: translateY(18px) scale(.96); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(10px) scale(.97); } }
@keyframes coche-pop { from { opacity: 0; transform: scale(.4); } }
@keyframes trace { from { stroke-dashoffset: 1; } }
.toast { animation: toast-in .42s var(--ease-out) backwards; }
.toast.sortie { animation: toast-out .22s var(--ease-in) forwards; }
.toast-ico { flex: none; }
.toast.ok .toast-ico, .toast.envoi .toast-ico { color: var(--good-on-ink); }
.toast.info .toast-ico { color: var(--action-on-ink); }
.toast-trace { stroke-dasharray: 1; stroke-dashoffset: 0; animation: trace .42s var(--ease) .12s backwards; }
.toast-txt { display: flex; flex-direction: column; min-width: 0; }
.toast-titre { font-weight: 650; }
.toast.envoi { padding-block: .75rem; }
.toast.envoi .toast-ico { width: 26px; height: 26px; animation: coche-pop .5s cubic-bezier(.3, 1.5, .5, 1) backwards; }
.toast.envoi .toast-trace { animation-delay: .2s; animation-duration: .5s; }
.toast.envoi .toast-txt > span { font-weight: 400; opacity: .88; font-size: var(--fs-2); }
.toast.avec-action { pointer-events: auto; padding-inline-end: .35rem; }
.toast-annuler { flex: none; min-height: 40px; margin-inline-start: .35rem; padding: .4rem .75rem; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--action-on-ink); font: 600 var(--fs-3)/1 var(--f-body); cursor: pointer; }
.toast-annuler:hover { background: color-mix(in srgb, var(--bg) 10%, transparent); }
.toast.err .toast-annuler, .toast.win .toast-annuler { color: inherit; text-decoration: underline; }

@media (prefers-reduced-motion: reduce) {
  @keyframes toast-in { from { opacity: 0; } }
  @keyframes coche-pop { from { opacity: 0; } }
  .toast-trace { animation: none !important; }
  .trait-vol::after { display: none; }
}
/* (fin du lot mouvement · B) */

/* Moins de mouvement demandé : on garde des fondus très courts, sans déplacement ni boucle */
@media (prefers-reduced-motion: reduce) {
  @keyframes rise { from { opacity: 0; } }
  @keyframes pop-in { from { opacity: 0; } }
  @keyframes sheet-in { from { opacity: 0; } }
  @keyframes fete-in { from { opacity: 0; } }
  @keyframes msg-in { from { opacity: 0; } }
  @keyframes vt-in { from { opacity: 0; } }
  *, *::before, *::after { animation-duration: .15s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .1s !important; scroll-behavior: auto !important; }
  .scene, .scene *, .fete-pluie, .bar-fill, .chart rect, .tape-dots i, .rec-dot, .journey li.next .j-dot, .msg-photo, .btn[aria-busy="true"]::after, .badge-n, .fete-ico, .rempli { animation: none !important; }
  .rempli, .type-opt.on.rempli { background-color: var(--sel-bg); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
}
/* Lot mouvement · A : la carte qui dit « Fait » (accueil). L'étape accomplie se coche en vert, l'anneau avance,
   puis elle s'efface vers le début de la ligne et la suivante arrive de l'autre côté. Calme : environ 1,6 s en tout. */
@property --p { syntax: '<number>'; inherits: true; initial-value: 0; }
.pas-fait, .pas-arrive { --sens: 1; }
[dir="rtl"] :is(.pas-fait, .pas-arrive) { --sens: -1; }
.pas.pas-fait { background: var(--good-soft); }
.pas-fait .pas-oeil { color: var(--good); }
.pas-fait .pas-titre { color: var(--ink-2); }
.pas-fait .pas-anneau { background: conic-gradient(var(--good) calc(var(--p) * 1turn), color-mix(in srgb, var(--good) 24%, transparent) 0); }
.pas-ok { display: flex; align-items: center; justify-content: center; gap: .55rem; min-height: 48px; margin: 0; font: 650 var(--fs-4)/1.2 var(--f-body); color: var(--good); }
.pas-coche { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--good); color: var(--good-soft); }
.pas-coche svg { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
@media (min-width: 761px) { .pas-ok { min-height: 44px; } }
@media (prefers-reduced-motion: no-preference) {
  .shell .home-col > .pas.pas-fait { animation: pas-vert .5s ease backwards; }
  .pas-fait .pas-anneau { animation: pas-monte .7s var(--ease) .3s backwards; }
  .pas-coche { animation: pas-coche .45s cubic-bezier(.3, 1.45, .5, 1) .15s backwards; }
  .pas-coche path { stroke-dasharray: 20; animation: pas-trait .38s ease-out .38s backwards; }
  .pas-ok > span:last-child { animation: fade-in .3s ease .5s backwards; }
  .shell .home-col > .pas.pas-fait.part { animation: pas-part .26s ease-in forwards; }
  .shell .home-col > .pas.pas-arrive { animation: pas-arrive .5s var(--ease) backwards; }
}
@keyframes pas-vert { from { background-color: var(--accent-soft); } }
@keyframes pas-monte { from { --p: var(--p0); } }
@keyframes pas-coche { from { opacity: 0; transform: scale(.4); } }
@keyframes pas-trait { from { stroke-dashoffset: 20; } }
@keyframes pas-part { to { opacity: 0; transform: translateX(calc(-20px * var(--sens))); } }
@keyframes pas-arrive { from { opacity: 0; transform: translateX(calc(28px * var(--sens))); } }
/* (fin du Lot mouvement · A) */
</style>
