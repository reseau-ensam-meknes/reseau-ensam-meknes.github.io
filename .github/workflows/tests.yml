# Branche jetable diag-ci-entree : mesure de la page d'entrée sur la machine de la CI (jamais fusionnée)
name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/tests/package-lock.json
      - name: Construire le site depuis les sources
        run: sh build.sh
      - name: Installer les outils de test
        working-directory: source/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Diagnostic au repos
        working-directory: source/tests
        run: SITE_DIR=../dist node e2e/zz-diag-ci.mjs
      - name: Diagnostic sous charge (4 processus occupés)
        working-directory: source/tests
        run: |
          for i in 1 2 3 4; do node -e "const t=Date.now();while(Date.now()-t<120000){}" & done
          SITE_DIR=../dist node e2e/zz-diag-ci.mjs
          wait
      - name: Le test seul
        working-directory: source/tests
        run: node --test --test-reporter=tap --test-name-pattern="la carte seulement si elle" e2e/site.test.mjs || true
